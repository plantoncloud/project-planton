syntax = "proto3";

package dev.planton.shared.cloudresourcekind;

import "google/protobuf/descriptor.proto";
import "shared/cloudresourcekind/cloud_provider_service_group.proto";
import "shared/cloudresourcekind/cloud_resource_provider.proto";

//enum value options for api-resource-kind
extend google.protobuf.EnumValueOptions {
  CloudResourceKindMeta kind_meta = 10100;
}

//api-resource-kind cloud-resource meta
message CloudResourceKindMeta {
  //cloud-resource provider
  CloudResourceProvider provider = 1;

  //the kind's API version — the version half of the manifest apiVersion
  //(e.g. "aws.planton.dev/v1alpha1" carries version "v1"). the value must match
  //the maturity grammar ^v\d+((alpha|beta)\d+)?$ (v1alpha1 → v1beta1 → v1):
  //the name declares the compatibility channel. this is the kind's sole
  //served version; per-version metadata arrives additively beside it (see
  //deprecations), and richer blocks follow if a kind ever serves multiple
  //versions at once. enum-value options are compile-time data, so the
  //grammar is enforced by the crkreflect registry tests rather than
  //protovalidate.
  string version = 2;

  //name of the kind as written in manifests. set only when it differs from the
  //enum value name; resolution falls back to the enum value name otherwise.
  //a kind keeps one enum entry for its entire life: new schema versions never
  //add sibling enum entries or version-suffixed names — version is a separate
  //axis carried in kind metadata, and the name stays constant across versions.
  //effective names must be unique across the registry (registry tests enforce
  //this): resolution is keyed by name, so a duplicate would make manifests
  //ambiguous about which kind they declare.
  string name = 3;

  //cloud-resource id-prefix — the per-kind segment embedded in every
  //resource id (cr_<id_prefix>_<ulid>) and the id's only kind
  //discriminator: CLI argument parsing, search lookups, and kind
  //auto-detection all resolve the kind FROM this segment, so ids stay
  //self-describing in the surfaces that carry nothing else (logs,
  //permission tuples, activity streams, support threads).
  //
  //Convention (every char rides every id for the resource's lifetime):
  //  - lowercase letters/digits only — NEVER an underscore, which is the
  //    id separator the parsers split on
  //  - starts with the provider's tag (gcp/aws/azure/k8s...) so any id
  //    attributes its provider at a glance
  //  - at most 8 characters total; target 5-7
  //  - unique across the whole registry — enforced mechanically (the
  //    prefix index fails construction on a duplicate)
  string id_prefix = 4;

  //flag indicating whether the cloud-resource kind can be used to launch a service.
  bool is_service_kind = 5;

  // Flag indicating whether the cloud-resource kind is a container kind.
  // Container kinds are drawn as BOUNDARIES on architecture diagrams — other
  // resources that reference them nest visually inside them (a VPC encloses
  // its subnets, a Kubernetes namespace encloses its deployments, a database
  // server encloses its databases).
  //
  // The doctrine — rooms vs. furniture: mark a kind ONLY if (a) it is a
  // place/scope in the provider's own model, and (b) an engineer whiteboarding
  // the system would draw it as a box AROUND other resources. Compute capacity
  // (node pools/groups, autoscaling groups, VM scale sets, elastic pools) is
  // never a container — those are servers that belong INSIDE a room, and no
  // other catalog resource is ever placed "inside" one. Flow-through hubs
  // (load balancers, gateways, routers) are nodes with arrows, not boxes.
  //
  // Containment is data-driven: marking a kind has no effect until another
  // resource actually references it. A reference into a container kind implies
  // nesting only when it expresses PLACEMENT ("deploy me into this"); a
  // reference that expresses ACCESS ("admit traffic from / let me talk to")
  // must carry the field-level
  // dev.planton.shared.foreignkey.v1.containment_exempt option so the diagram
  // never nests a resource inside something it merely connects to.
  bool container_kind = 6;

  //components that must be deployed before this component can function.
  //order matters: index 0 is deployed first. the E2E framework installs these
  //(resolved transitively) before the component under test and tears them down
  //in reverse order; a consumer may pin a prerequisite's exact install shape
  //via an e2e/prerequisites/<kind>.yaml override, which wins over the
  //prerequisite's own e2e/prerequisite.yaml install profile. this is also
  //used by the platform for dependency ordering in infra charts.
  //example: KubernetesPostgres needs KubernetesCloudNativePgOperator
  //because it creates postgresql.cnpg.io/v1 Cluster resources.
  repeated CloudResourceKind prerequisites = 7;

  //set ONLY for kinds whose spec is a direct projection of a single Kubernetes
  //custom resource -- i.e. the Terraform module is a thin `kubernetes_manifest`
  //passthrough rather than hand-written provider logic. its presence flips the
  //proto->tfvars converter to emit the manifest-shaped (camelCase, pruned) spec
  //and drives deterministic thin-module generation (see `planton tofu
  //generate-module`). absent for provider-abstraction kinds (aws/gcp/etc.),
  //which keep idiomatic snake_case typed variables. the api_version/kind here
  //are the UPSTREAM CRD's group-version-kind, distinct from the Planton
  //groupVersion returned by crkreflect.GroupVersion.
  KubernetesManifestProjection kubernetes_manifest_projection = 8;

  //schema versions of this kind announced as deprecated. a deprecated version
  //keeps working exactly as before -- documents authored at it are accepted
  //and converted like any known version; deprecation is advice, never a gate,
  //and REMOVING a version stays a separate, telemetry-gated decision. what
  //changes is visibility: every surface that speaks versions (the discovery
  //API, dashboards, CLI listings) announces the version as on its way out.
  //each entry must name a version this release actually ships a schema for,
  //must not name the served version (there would be nothing to upgrade to),
  //and must have an authored conversion path to the served version -- the
  //bundle conformance gate refuses dead ends, so a deprecation can never
  //outlive its version or strand its writers. the upgrade target is never
  //authored: it is always the kind's served version, derived, so it cannot
  //drift. like every kind_meta field this is compile-time data enforced by
  //the crkreflect registry tests and the bundle conformance gate.
  repeated CloudResourceKindVersionDeprecation deprecations = 9;

  //the provider-console service group this kind is browsed under — the
  //coarse UX taxonomy (AWS "Compute", Azure "Networking"), NOT the fine
  //family sub-bands the enum numbers allocate in (a sub-band clusters kinds
  //that share code and fixtures; many sub-bands map into one group). exactly
  //one group per kind: explorers, docs navigation, and AI grounding each
  //need one home per component, and multi-service relationships belong in
  //the component's documentation. REQUIRED for kinds of grouped providers
  //(aws, azure, gcp, kubernetes, cloudflare, digital_ocean) and PROHIBITED
  //for providers without a service taxonomy — the crkreflect registry tests
  //enforce both directions, including that the group belongs to the kind's
  //own provider.
  CloudProviderServiceGroup service_group = 10;
}

//marks one of a kind's schema versions as deprecated. carried on
//CloudResourceKindMeta.deprecations; see that field for the contract.
message CloudResourceKindVersionDeprecation {
  //the deprecated schema version, e.g. "v1alpha1". must match the maturity
  //grammar, resolve to a schema this release ships for the kind, and differ
  //from the kind's served version.
  string version = 1;

  //optional plain-language context appended to the derived deprecation
  //notice. surfaces compose the base sentence ("deprecated -- upgrade to
  //<served version>") from data; this adds the why, or a migration caveat
  //worth a sentence. empty is legal and common.
  string note = 2;
}

//identifies the upstream Kubernetes custom resource that a CloudResourceKind
//projects onto. carried on CloudResourceKindMeta for projection kinds only.
message KubernetesManifestProjection {
  //upstream CRD groupVersion, e.g. "networking.istio.io/v1".
  string api_version = 1;
  //upstream CRD kind, e.g. "DestinationRule".
  string kind = 2;
}

enum CloudResourceKind {
  // Numbering scheme: every cloud provider owns a 1,000-wide band, giving
  // each catalog room to grow to its provider's full surface without ever
  // colliding with a neighbor. Allocation discipline:
  //
  //   1–49        test/dev/custom
  //   1000–1999   AWS                    2000–2999   Azure
  //   3000–3999   GCP                    4000–4999   Kubernetes
  //   5000–5999   DigitalOcean           7000–7999   Cloudflare
  //   8000–8999   Auth0                  9000–9999   OpenFGA
  //
  // The next new provider takes the next free 1,000 band. Within a band,
  // allocate contiguous family sub-bands deliberately
  // at the start of an authoring wave — never grab numbers ad hoc — and
  // record the family in a section comment. Enum numbers are transport-only:
  // every durable store keys kinds by NAME, so pre-launch renumbering is
  // legal (and `reserved` statements are prohibited); after launch, numbers
  // freeze under the registry-snapshot gate.

  // 0: Default/unspecified
  unspecified = 0;

  // 1–49: Test/dev/custom
  TestCloudResourceGeneric = 1 [(kind_meta) = {
    provider: _test
    version: "v1alpha2"
    id_prefix: "tcrg"
    // The permanent deprecation fixture: the kind graduated to v1alpha2 with
    // an authored conversion bridge, so v1alpha1 exercises the deprecation
    // lane through every gate (registry tests, bundle conformance, discovery).
    deprecations: {
      version: "v1alpha1"
      note: "superseded by the v1alpha2 shape"
    }
  }];
  TestCloudResourceKubernetes = 2 [(kind_meta) = {
    provider: _test
    version: "v1alpha1"
    id_prefix: "tcrk"
  }];

  // 1000–1999: AWS resources
  // AwsSubnet is a prerequisite because an ALB requires at least two subnets
  // in different availability zones -- the spec's subnet references must
  // resolve before the load balancer can be created.
  AwsAlb = 1000 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsalb"
    prerequisites: [AwsSubnet]
    service_group: aws_networking_content_delivery
  }];
  AwsCertManagerCert = 1001 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsacm"
    service_group: aws_security_identity_compliance
  }];
  AwsCloudFront = 1002 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awscf"
    service_group: aws_networking_content_delivery
  }];
  AwsDynamodb = 1003 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsdyn"
    service_group: aws_database
  }];
  AwsEcrRepo = 1004 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsecr"
    service_group: aws_containers
  }];
  AwsEcsCluster = 1005 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsecsc"
    container_kind: true
    service_group: aws_containers
  }];
  // AwsEcsCluster, AwsEcsTaskDefinition, and AwsSubnet are prerequisites
  // because a service schedules a referenced task-definition revision into
  // a referenced live cluster and places task network interfaces into
  // referenced subnets -- all three references must resolve first.
  AwsEcsService = 1006 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsecss"
    prerequisites: [
      AwsEcsCluster,
      AwsEcsTaskDefinition,
      AwsSubnet
    ]
    service_group: aws_containers
  }];
  // AwsSubnet and AwsIamRole are prerequisites because the control plane
  // attaches its network interfaces into referenced subnets and assumes a
  // referenced cluster role that must already carry AmazonEKSClusterPolicy.
  AwsEksCluster = 1007 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awseks"
    container_kind: true
    prerequisites: [
      AwsSubnet,
      AwsIamRole
    ]
    service_group: aws_containers
  }];
  AwsIamRole = 1008 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsiamr"
    service_group: aws_security_identity_compliance
  }];
  AwsLambda = 1009 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awslam"
    prerequisites: [AwsIamRole]
    service_group: aws_compute
  }];
  AwsRdsCluster = 1010 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsrdsc"
    prerequisites: [AwsSubnet]
    service_group: aws_database
  }];
  AwsRdsInstance = 1011 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsrdsi"
    prerequisites: [AwsSubnet]
    service_group: aws_database
  }];
  AwsRoute53Zone = 1012 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsr53z"
    container_kind: true
    service_group: aws_networking_content_delivery
  }];
  AwsS3Bucket = 1013 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awss3"
    service_group: aws_storage
  }];
  // AwsVpc is a prerequisite because a target group's health checks and
  // target registrations live inside one VPC -- the spec's vpc_id reference
  // must resolve before the group can be created.
  AwsLbTargetGroup = 1014 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awslbtg"
    prerequisites: [AwsVpc]
    service_group: aws_networking_content_delivery
  }];
  // AwsVpc is a prerequisite because every security group is created in a
  // VPC; the E2E install profile resolves vpc_id against the VPC prerequisite.
  AwsSecurityGroup = 1015 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awssg"
    prerequisites: [AwsVpc]
    service_group: aws_networking_content_delivery
  }];
  AwsVpc = 1016 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsvpc"
    container_kind: true
    service_group: aws_networking_content_delivery
  }];
  // AwsEksCluster is a prerequisite because nodes register with a live
  // control plane; AwsIamRole and AwsSubnet back the node role and worker
  // subnet references.
  AwsEksNodeGroup = 1017 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awseksng"
    prerequisites: [
      AwsEksCluster,
      AwsIamRole,
      AwsSubnet
    ]
    service_group: aws_containers
  }];
  AwsIamUser = 1018 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsuser"
    service_group: aws_security_identity_compliance
  }];
  AwsKmsKey = 1019 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awskms"
    service_group: aws_security_identity_compliance
  }];
  AwsEc2Instance = 1020 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsec2"
    service_group: aws_compute
  }];
  // Every Client VPN endpoint requires an ACM server certificate at create
  // time; the imported self-signed fixture satisfies it. Subnets/VPC are
  // optional composition (a zero-association endpoint is valid) -- composed
  // scenarios declare them via the e2e-prerequisites annotation.
  AwsClientVpn = 1021 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsvpn"
    prerequisites: [AwsCertManagerCert]
    service_group: aws_networking_content_delivery
  }];
  AwsDocumentDb = 1022 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsdocdb"
    prerequisites: [AwsSubnet]
    service_group: aws_database
  }];
  // AwsRoute53Zone is a prerequisite because every record lives inside a
  // hosted zone -- the spec's zone_id reference must resolve before the
  // record can be created.
  AwsRoute53DnsRecord = 1023 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsr53d"
    prerequisites: [AwsRoute53Zone]
    service_group: aws_networking_content_delivery
  }];
  // AwsS3Bucket is a prerequisite because the object set's bucket reference
  // is required -- objects cannot exist without the bucket that holds them.
  AwsS3ObjectSet = 1024 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awss3o"
    prerequisites: [AwsS3Bucket]
    service_group: aws_storage
  }];
  AwsSqsQueue = 1025 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awssqs"
    service_group: aws_application_integration
  }];
  AwsSnsTopic = 1026 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awssns"
    service_group: aws_application_integration
  }];
  AwsEventBridgeBus = 1027 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awseb"
    container_kind: true
    service_group: aws_application_integration
  }];
  AwsEventBridgeRule = 1028 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsebr"
    service_group: aws_application_integration
  }];
  AwsIamOidcProvider = 1029 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsoidc"
    service_group: aws_security_identity_compliance
  }];
  AwsIamPolicy = 1030 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsiamp"
    service_group: aws_security_identity_compliance
  }];
  // AwsIamRole is a prerequisite because an instance profile is a wrapper that
  // must contain a role to be useful -- the profile's spec requires a role
  // reference, so the role must be deployed first.
  AwsIamInstanceProfile = 1031 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsiamip"
    prerequisites: [AwsIamRole]
    service_group: aws_security_identity_compliance
  }];
  // AwsAlb and AwsLbTargetGroup are prerequisites because a listener is an
  // attachment point on a load balancer and its default action almost always
  // forwards to a target group -- both references must resolve before the
  // listener can be created.
  AwsLbListener = 1032 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awslbl"
    prerequisites: [
      AwsAlb,
      AwsLbTargetGroup
    ]
    service_group: aws_networking_content_delivery
  }];
  // AwsLbListener is a prerequisite because a rule only exists as an
  // attachment on a listener -- the listener_arn reference must resolve
  // before the rule can be created.
  AwsLbListenerRule = 1033 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awslblr"
    prerequisites: [AwsLbListener]
    service_group: aws_networking_content_delivery
  }];
  AwsLaunchTemplate = 1034 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awslt"
    service_group: aws_compute
  }];
  // AwsSubnet and AwsLaunchTemplate are prerequisites because a group
  // cannot exist without subnets to place capacity in and a launch
  // template to launch from -- the spec's subnets and launch_template
  // references must resolve before the group can be created.
  AwsAutoScalingGroup = 1035 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsasg"
    prerequisites: [
      AwsSubnet,
      AwsLaunchTemplate
    ]
    service_group: aws_compute
  }];
  // AwsEksCluster is a prerequisite because an add-on installs onto a live
  // control plane -- the spec's cluster_name reference must resolve before
  // the add-on can be created.
  AwsEksAddon = 1036 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awseksad"
    prerequisites: [AwsEksCluster]
    service_group: aws_containers
  }];
  // AwsEksCluster, AwsIamRole, and AwsSubnet are prerequisites because a
  // Fargate profile attaches to a live control plane, runs pods as a
  // referenced pod-execution role, and launches them into referenced
  // private subnets -- all three references must resolve first.
  AwsEksFargateProfile = 1037 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awseksfp"
    prerequisites: [
      AwsEksCluster,
      AwsIamRole,
      AwsSubnet
    ]
    service_group: aws_containers
  }];
  // AwsEksCluster and AwsIamRole are prerequisites because an access entry
  // grants a referenced IAM principal access to a live control plane --
  // both references must resolve before the entry can be created.
  AwsEksAccessEntry = 1038 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awseksae"
    prerequisites: [
      AwsEksCluster,
      AwsIamRole
    ]
    service_group: aws_containers
  }];
  // AwsIamRole is a prerequisite because the kind's default posture --
  // Fargate with the awslogs logging default -- is rejected by AWS at
  // registration time without an execution role the agent can assume.
  AwsEcsTaskDefinition = 1039 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsecstd"
    prerequisites: [AwsIamRole]
    service_group: aws_containers
  }];
  AwsHttpApiGateway = 1040 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awshttp"
    service_group: aws_networking_content_delivery
  }];
  // AwsIamRole is a prerequisite because a state machine cannot be created
  // without an execution role it can assume -- the spec's role_arn reference
  // must resolve before the CreateStateMachine call.
  AwsStepFunction = 1041 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awssfn"
    prerequisites: [AwsIamRole]
    service_group: aws_application_integration
  }];
  // AwsSubnet is a prerequisite because a VPC link is a set of managed ENIs
  // provisioned into referenced subnets -- the subnet references must resolve
  // before the link can be created. Security groups are optional on the link,
  // so they compose per-scenario rather than as a registry prerequisite.
  AwsHttpApiVpcLink = 1156 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awshttpv"
    prerequisites: [AwsSubnet]
    service_group: aws_networking_content_delivery
  }];
  // AwsCertManagerCert is a prerequisite because a custom domain cannot be
  // created without a TLS certificate in the same region covering the domain
  // -- the spec's certificate_arn reference must resolve first.
  AwsHttpApiDomain = 1157 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awshttpd"
    prerequisites: [AwsCertManagerCert]
    service_group: aws_networking_content_delivery
  }];
  // AwsVpcEndpoint's composed E2E scenarios reference the AwsVpc
  // prerequisite's outputs (vpc_id + default_route_table_id for gateway
  // endpoints) and the AwsSubnet pair's subnet_id outputs (interface
  // endpoints), so both are genuine deploy-order prerequisites.
  AwsVpcEndpoint = 1042 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsvpce"
    prerequisites: [
      AwsVpc,
      AwsSubnet
    ]
    service_group: aws_networking_content_delivery
  }];
  AwsElasticacheUser = 1043 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsecu"
    service_group: aws_database
  }];
  // AwsElasticacheUser is a genuine prerequisite: AWS refuses to create a
  // user group that does not contain a user named "default", so a group's
  // composed E2E scenario must resolve a deployed user's outputs.
  AwsElasticacheUserGroup = 1044 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsecug"
    prerequisites: [AwsElasticacheUser]
    service_group: aws_database
  }];
  AwsRedshiftServerlessNamespace = 1045 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsrsns"
    container_kind: true
    service_group: aws_analytics
  }];
  // The namespace is a genuine prerequisite: a workgroup attaches to
  // exactly one namespace by name at create time, so its composed E2E
  // scenario must resolve a deployed namespace's outputs. AwsSubnet is a
  // prerequisite because Redshift Serverless requires the workgroup's
  // subnets to span three availability zones.
  AwsRedshiftServerlessWorkgroup = 1046 [(kind_meta) = {
    provider: aws
    version: "v1alpha1"
    id_prefix: "awsrswg"
    prerequisites: [
      AwsRedshiftServerlessNamespace,
      AwsSubnet
    ]
    service_group: aws_analytics
  }];
  // AwsSubnet is a prerequisite because the module builds an ElastiCache
  // subnet group from referenced subnets -- the spec's subnet references
  // must resolve before the replication group can deploy.
  AwsRedisElasticache = 1050 [(kind_meta) = {
    provider: aws
