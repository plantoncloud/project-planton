# Subjects and inbox preview lines for the emails the identity server sends,
# in the product's voice. Bodies live in the html/ and text/ templates; every
# other message key keeps Keycloak's default.
passwordResetSubject=Reset your password
passwordResetPreview=Choose a new password. If you did not ask for this, ignore this email.
executeActionsSubject=Finish setting up your account
executeActionsPreview=An administrator asked you to update your account.
executeActionsGeneric=complete the steps it asks for
emailVerificationSubject=Verify your email address
emailVerificationPreview=Confirm the address on your new account.
emailTestSubject=A test email from your identity server
emailTestPreview=If this reached you, password resets reach your teammates the same way.
