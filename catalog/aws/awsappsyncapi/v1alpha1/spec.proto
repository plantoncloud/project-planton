  string owner_contact = 1 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];

  // The auth providers clients may use, by phase (below). At least
  // one.
  repeated AwsAppSyncEventsAuthProvider auth_providers = 2 [(buf.validate.field).repeated.min_items = 1];

  // Who may open a WebSocket connection - one or more declared
  // provider types.
  repeated string connection_auth_modes = 3 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      string: {
        in: [
          "API_KEY",
          "AWS_IAM",
          "AMAZON_COGNITO_USER_POOLS",
          "OPENID_CONNECT",
          "AWS_LAMBDA"
        ]
      }
    }
  }];

  // The default publish authorization for namespaces that do not
  // override it.
  repeated string default_publish_auth_modes = 4 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      string: {
        in: [
          "API_KEY",
          "AWS_IAM",
          "AMAZON_COGNITO_USER_POOLS",
          "OPENID_CONNECT",
          "AWS_LAMBDA"
        ]
      }
    }
  }];

  // The default subscribe authorization for namespaces that do not
  // override it.
  repeated string default_subscribe_auth_modes = 5 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      string: {
        in: [
          "API_KEY",
          "AWS_IAM",
          "AMAZON_COGNITO_USER_POOLS",
          "OPENID_CONNECT",
          "AWS_LAMBDA"
        ]
      }
    }
  }];

