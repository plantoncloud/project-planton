  string app_id_client_regex = 3 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
}

// AwsAppSyncEventsLogConfig turns on CloudWatch event logging.
message AwsAppSyncEventsLogConfig {
