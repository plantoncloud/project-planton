  string code_handlers = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 32768
  ];

  // Publish auth modes overriding the API's
  // default_publish_auth_modes for this namespace.
  repeated string publish_auth_modes = 3 [(buf.validate.field).repeated.items = {
    string: {
      in: [
        "API_KEY",
        "AWS_IAM",
        "AMAZON_COGNITO_USER_POOLS",
        "OPENID_CONNECT",
        "AWS_LAMBDA"
      ]
    }
  }];

  // Subscribe auth modes overriding the API's
  // default_subscribe_auth_modes for this namespace.
  repeated string subscribe_auth_modes = 4 [(buf.validate.field).repeated.items = {
    string: {
      in: [
        "API_KEY",
        "AWS_IAM",
        "AMAZON_COGNITO_USER_POOLS",
        "OPENID_CONNECT",
        "AWS_LAMBDA"
      ]
    }
  }];

