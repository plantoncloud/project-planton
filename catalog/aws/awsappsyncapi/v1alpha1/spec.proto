// AwsAppSyncChannelNamespace is one channel namespace - a named
// grouping of channels (e.g. namespace "chat" serves channels
// "chat/room1", "chat/room2") with optional event handlers and
// per-namespace auth overrides.
message AwsAppSyncChannelNamespace {
  // The namespace's name - the for_each key and half its import ID.
