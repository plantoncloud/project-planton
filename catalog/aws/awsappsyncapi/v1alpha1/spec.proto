    id: "datasource.config_matches_type"
    message: "the data source's config block must match its type - dynamodb, lambda, http, opensearch, elasticsearch, eventbridge, or relational_database; NONE and AMAZON_BEDROCK_RUNTIME take no config block"
    expression: "(this.type == 'AMAZON_DYNAMODB' ? has(this.dynamodb) : !has(this.dynamodb)) && (this.type == 'AWS_LAMBDA' ? has(this.lambda) : !has(this.lambda)) && (this.type == 'HTTP' ? has(this.http) : !has(this.http)) && (this.type == 'AMAZON_OPENSEARCH_SERVICE' ? has(this.opensearch) : !has(this.opensearch)) && (this.type == 'AMAZON_ELASTICSEARCH' ? has(this.elasticsearch) : !has(this.elasticsearch)) && (this.type == 'AMAZON_EVENTBRIDGE' ? has(this.eventbridge) : !has(this.eventbridge)) && (this.type == 'RELATIONAL_DATABASE' ? has(this.relational_database) : !has(this.relational_database))"
  };

