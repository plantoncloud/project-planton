// AwsAppSyncEventsApi is the Events API model: real-time pub/sub over
// WebSockets. Authorization is declared per lifecycle phase - who may
// connect, who may publish, who may subscribe - against a shared list
// of auth providers.
message AwsAppSyncEventsApi {
  // Every auth mode used in a phase must name a declared provider
  // (AWS rejects undeclared modes server-side; front-loaded here).
  option (buf.validate.message).cel = {
    id: "events.connection_modes_declared"
    message: "every connection_auth_modes entry must match a declared auth provider's type"
    expression: "this.connection_auth_modes.all(m, this.auth_providers.exists(p, p.type == m))"
  };
  option (buf.validate.message).cel = {
    id: "events.publish_modes_declared"
    message: "every default_publish_auth_modes entry must match a declared auth provider's type"
    expression: "this.default_publish_auth_modes.all(m, this.auth_providers.exists(p, p.type == m))"
  };
  option (buf.validate.message).cel = {
    id: "events.subscribe_modes_declared"
    message: "every default_subscribe_auth_modes entry must match a declared auth provider's type"
    expression: "this.default_subscribe_auth_modes.all(m, this.auth_providers.exists(p, p.type == m))"
  };
  // The same type-config pairing as the GraphQL arm, with the Events
  // twist: cognito here REQUIRES aws_region (AWS's own asymmetry).
  option (buf.validate.message).cel = {
    id: "events.auth_config_matches_type"
    message: "each auth provider's config must match its type - cognito with AMAZON_COGNITO_USER_POOLS, openid_connect with OPENID_CONNECT, lambda with AWS_LAMBDA, and none of the three with API_KEY or AWS_IAM"
    expression: "this.auth_providers.all(p, (p.type == 'AMAZON_COGNITO_USER_POOLS' ? has(p.cognito) : !has(p.cognito)) && (p.type == 'OPENID_CONNECT' ? has(p.openid_connect) : !has(p.openid_connect)) && (p.type == 'AWS_LAMBDA' ? has(p.lambda) : !has(p.lambda)))"
  };
  option (buf.validate.message).cel = {
    id: "events.auth_types_unique"
    message: "each authorization type may appear at most once in auth_providers"
    expression: "this.auth_providers.map(p, p.type).unique()"
  };
  // Channel namespace names key the for_each and the
  // channel_namespace_arns output map.
  option (buf.validate.message).cel = {
    id: "events.channel_namespace_names_unique"
    message: "channel namespace names must be unique within the API"
    expression: "this.channel_namespaces.map(n, n.name).unique()"
  };

