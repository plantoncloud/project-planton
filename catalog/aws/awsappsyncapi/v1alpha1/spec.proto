  // sources.
  AwsAppSyncChannelHandlerConfigs handler_configs = 5;
}

// AwsAppSyncChannelHandlerConfigs pairs the namespace's publish and
// subscribe handlers.
message AwsAppSyncChannelHandlerConfigs {
  // The handler for publish events.
  AwsAppSyncChannelHandler on_publish = 1;

  // The handler for subscribe events.
  AwsAppSyncChannelHandler on_subscribe = 2;
}

// AwsAppSyncChannelHandler routes one event phase to a data source.
message AwsAppSyncChannelHandler {
  // How the handler runs: CODE (the namespace's code_handlers
