syntax = "proto3";

package dev.planton.aws.awsappsyncapi.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";

// AwsAppSyncApiSpec defines one AWS AppSync API - AWS's managed API
// service - with everything that belongs to the API managed in-line:
// data sources, resolvers, functions, schema types, caching, API keys,
// channel namespaces, and a custom domain.
//
// AppSync ships two API models, and this spec pivots on exactly one:
//
// GRAPHQL (the graphql arm): a GraphQL API over your data sources -
// you provide an SDL schema and resolvers that map fields to data
// source operations. Also covers MERGED APIs (a federation surface
// that merges other GraphQL APIs' schemas).
//
// EVENTS (the events arm): serverless real-time pub/sub over
// WebSockets - clients publish and subscribe on channels grouped into
// namespaces; no schema and no resolvers.
//
// Data sources, API keys, and the custom domain sit at the top level
// because AWS attaches them to either API model. Resolvers, functions,
// types, and caching are GraphQL concepts and live inside the graphql
// arm; channel namespaces are the Events concept and live inside the
// events arm.
message AwsAppSyncApiSpec {
  // The API is exactly one of the two AppSync models, for life.
  option (buf.validate.message).cel = {
    id: "spec.exactly_one_api_arm"
    message: "set exactly one of graphql and events - an AppSync API is either a GraphQL API or an Events API"
    expression: "has(this.graphql) != has(this.events)"
  };
  // Data source names key the for_each on both engines and the output
  // maps.
  option (buf.validate.message).cel = {
    id: "spec.datasource_names_unique"
    message: "data source names must be unique within the API"
    expression: "this.datasources.map(d, d.name).unique()"
  };
  // API key names key the for_each on both engines and the
  // api_key_ids output map.
  option (buf.validate.message).cel = {
    id: "spec.api_key_names_unique"
    message: "api key names must be unique within the API"
    expression: "this.api_keys.map(k, k.name).unique()"
  };

  // The AWS region the API lives in. Example: "us-west-2".
  string region = 1 [(buf.validate.field).string.min_len = 1];

  // The GraphQL API model: an SDL schema, resolvers over data
  // sources, optional caching, and the MERGED federation variant.
  AwsAppSyncGraphqlApi graphql = 2;

  // The Events API model: real-time pub/sub over channel namespaces
  // with per-phase (connect/publish/subscribe) authorization.
  AwsAppSyncEventsApi events = 3;

  // The API's data sources, keyed by name - what resolvers (GraphQL)
  // and channel-namespace handlers (Events) call into. A data source
  // belongs to exactly one API for life.
  repeated AwsAppSyncDatasource datasources = 4;

  // API keys for the API_KEY authorization mode, keyed by a spec-side
  // name (AWS assigns the real key id). Only useful when the chosen
  // arm actually enables API_KEY auth - a key on an API without that
  // mode authenticates nothing.
  repeated AwsAppSyncApiKey api_keys = 5;

  // A custom domain fronting the API instead of the AWS-generated
  // endpoint. AppSync custom domains require an ACM certificate in
  // us-east-1 regardless of the API's own region (the CloudFront
  // class).
  AwsAppSyncCustomDomain custom_domain = 6;
}

// ---------------------------------------------------------------------------
// The GraphQL arm
// ---------------------------------------------------------------------------

// AwsAppSyncGraphqlApi is the GraphQL API model: authorization, an
// SDL schema, resolvers and functions over the API's data sources,
// optional server-side caching, and the MERGED federation variant.
message AwsAppSyncGraphqlApi {
  // The primary auth provider's config block must match its type
  // (AWS rejects mismatches server-side; front-loaded here).
  option (buf.validate.message).cel = {
    id: "graphql.auth_config_matches_type"
    message: "the auth provider's config must match its type - user_pool with AMAZON_COGNITO_USER_POOLS, openid_connect with OPENID_CONNECT, lambda with AWS_LAMBDA, and none of the three with API_KEY or AWS_IAM"
    expression: "(this.auth.type == 'AMAZON_COGNITO_USER_POOLS' ? has(this.auth.user_pool) : !has(this.auth.user_pool)) && (this.auth.type == 'OPENID_CONNECT' ? has(this.auth.openid_connect) : !has(this.auth.openid_connect)) && (this.auth.type == 'AWS_LAMBDA' ? has(this.auth.lambda) : !has(this.auth.lambda))"
  };
  // The primary Cognito provider decides what happens to requests
  // that match no other provider - AWS requires the decision.
  option (buf.validate.message).cel = {
    id: "graphql.primary_cognito_requires_default_action"
    message: "the primary auth provider's user_pool requires default_action (ALLOW or DENY)"
    expression: "!has(this.auth.user_pool) || this.auth.user_pool.default_action != ''"
  };
  // Additional providers follow the same type-config pairing...
  option (buf.validate.message).cel = {
    id: "graphql.additional_auth_config_matches_type"
    message: "each additional auth provider's config must match its type - user_pool with AMAZON_COGNITO_USER_POOLS, openid_connect with OPENID_CONNECT, lambda with AWS_LAMBDA, and none of the three with API_KEY or AWS_IAM"
    expression: "this.additional_auth_providers.all(p, (p.type == 'AMAZON_COGNITO_USER_POOLS' ? has(p.user_pool) : !has(p.user_pool)) && (p.type == 'OPENID_CONNECT' ? has(p.openid_connect) : !has(p.openid_connect)) && (p.type == 'AWS_LAMBDA' ? has(p.lambda) : !has(p.lambda)))"
  };
  // ...but default_action belongs to the primary provider only (AWS's
  // additionalAuthenticationProviders carry no defaultAction).
  option (buf.validate.message).cel = {
    id: "graphql.additional_cognito_no_default_action"
    message: "default_action applies only to the primary auth provider - remove it from additional providers' user_pool blocks"
    expression: "this.additional_auth_providers.all(p, !has(p.user_pool) || p.user_pool.default_action == '')"
  };
  // Each auth mode can appear once across primary + additionals (AWS
  // rejects duplicates at create).
  option (buf.validate.message).cel = {
    id: "graphql.auth_types_unique"
    message: "each authorization type may appear at most once across the primary and additional auth providers"
    expression: "(this.additional_auth_providers.map(p, p.type) + [this.auth.type]).unique()"
  };
  // A MERGED API's schema and resolvers come from its source APIs -
  // AWS forbids defining them on the merged API itself.
  option (buf.validate.message).cel = {
    id: "graphql.merged_owns_no_schema_or_resolvers"
    message: "a MERGED API merges its source APIs' schemas - remove schema, types, functions, resolvers, and cache (they belong on the source APIs)"
    expression: "!has(this.merged) || (this.schema == '' && this.types.size() == 0 && this.functions.size() == 0 && this.resolvers.size() == 0 && !has(this.cache))"
  };
  // Function names key the for_each, the function_ids output map, and
  // resolver pipeline references.
  option (buf.validate.message).cel = {
    id: "graphql.function_names_unique"
    message: "function names must be unique within the API"
    expression: "this.functions.map(f, f.name).unique()"
  };
  // A resolver's identity is its type.field position in the schema.
  option (buf.validate.message).cel = {
    id: "graphql.resolver_positions_unique"
    message: "resolvers must be unique per type.field position"
    expression: "this.resolvers.map(r, r.type + '.' + r.field).unique()"
  };
  // Type entries key the for_each by their declared name.
  option (buf.validate.message).cel = {
    id: "graphql.type_names_unique"
    message: "type names must be unique within the API"
    expression: "this.types.map(t, t.name).unique()"
  };

  // The API's name in AWS - an explicit field rather than
  // metadata.name because GraphQL API names allow only letters,
  // digits, and underscores (NO hyphens), starting with a letter or
  // underscore.
  string api_name = 1 [(buf.validate.field).string = {
    min_len: 1
    pattern: "^[A-Za-z_][0-9A-Za-z_]*$"
  }];

  // The primary authorization provider - every GraphQL API has
  // exactly one, plus optional additionals for multi-auth schemas
  // (fields pick providers with @aws_auth-style directives).
  AwsAppSyncGraphqlAuthProvider auth = 2 [(buf.validate.field).required = true];

  // Additional authorization providers for multi-auth APIs.
  repeated AwsAppSyncGraphqlAuthProvider additional_auth_providers = 3;

  // The GraphQL schema in SDL. Applied via AppSync's async schema
  // creation; AWS reports schema errors at apply, not at plan. NOTE:
  // the provider performs no drift detection on the schema -
  // out-of-band schema edits are invisible until the next in-band
  // change (recorded in the import catalog as config-only).
  string schema = 4;

  // Who can call the API. GLOBAL (AWS default when unset) serves the
  // public AppSync endpoint; PRIVATE serves only through VPC
  // endpoints. Fixed for life - changing it replaces the API.
  string visibility = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "GLOBAL",
        "PRIVATE"
      ]
    }
  ];

  // Turn OFF schema introspection (__schema queries). AWS's default
  // is enabled; disable it to keep the schema shape private on
  // public-facing APIs.
  bool disable_introspection = 6;

  // The maximum nesting depth a query may reach, 1-75. Unset (0)
  // means AWS's default: unlimited depth.
  int64 query_depth_limit = 7 [(buf.validate.field).cel = {
    id: "graphql.query_depth_limit_range"
    message: "query_depth_limit must be between 1 and 75 (0 = unlimited)"
    expression: "this == 0 || (this >= 1 && this <= 75)"
  }];

  // The maximum resolvers one query may invoke, 1-10000. Unset (0)
  // means AWS's default: 10000.
  int64 resolver_count_limit = 8 [(buf.validate.field).cel = {
    id: "graphql.resolver_count_limit_range"
    message: "resolver_count_limit must be between 1 and 10000 (0 = AWS default)"
    expression: "this == 0 || (this >= 1 && this <= 10000)"
  }];

  // Trace requests with AWS X-Ray.
  bool xray_enabled = 9;

  // Where AppSync writes request logs. Unset means no logging.
  AwsAppSyncGraphqlLogConfig log_config = 10;

  // Per-data-source, per-operation, and per-resolver CloudWatch
  // metrics granularity. Unset means AWS's defaults.
  AwsAppSyncGraphqlEnhancedMetrics enhanced_metrics = 11;

  // The REGIONAL-scope WAFv2 web ACL protecting this GraphQL API, by
  // ARN - the modules create the web-ACL association alongside the
  // API (the AwsAlb.spec.web_acl_arn pattern). A GraphQL API has at
  // most one web ACL; the web ACL must live in the API's region.
  // (AWS's WAF association supports GraphQL APIs, not Events APIs.)
  // Can reference an AwsWafWebAcl resource.
  dev.planton.shared.foreignkey.v1.StringValueOrRef web_acl_arn = 12 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsWafWebAcl,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.web_acl_arn"
  ];

  // Server-side response caching - one cache per API (AWS's own
  // model: the cache's identity IS the API).
  AwsAppSyncGraphqlCache cache = 13;

  // Schema types managed individually (outside the schema document),
  // keyed by their declared name.
  repeated AwsAppSyncGraphqlType types = 14;

  // Pipeline functions, keyed by name - reusable units of resolver
  // logic bound to a data source. Resolvers reference them by name in
  // pipeline_functions (the modules join names to AWS function ids).
  repeated AwsAppSyncGraphqlFunction functions = 15;

  // Resolvers mapping schema fields to data source operations, keyed
  // by their type.field position.
  repeated AwsAppSyncGraphqlResolver resolvers = 16;

  // Makes this a MERGED API - a federation surface serving the merged
  // schemas of its source APIs. Set at create, for life (changing the
  // API type replaces the API).
  AwsAppSyncGraphqlMerged merged = 17;
}

// AwsAppSyncGraphqlAuthProvider is one authorization provider - the
// primary or an additional. The type decides which config block (if
// any) accompanies it.
message AwsAppSyncGraphqlAuthProvider {
  // How callers authenticate: API_KEY (keys from api_keys), AWS_IAM
  // (SigV4), AMAZON_COGNITO_USER_POOLS (user_pool), OPENID_CONNECT
  // (openid_connect), or AWS_LAMBDA (lambda authorizer).
  string type = 1 [(buf.validate.field).string = {
    in: [
      "API_KEY",
      "AWS_IAM",
      "AMAZON_COGNITO_USER_POOLS",
      "OPENID_CONNECT",
      "AWS_LAMBDA"
    ]
  }];

  // Cognito user pool authorization (type AMAZON_COGNITO_USER_POOLS).
  AwsAppSyncCognitoUserPoolAuth user_pool = 2;

  // OpenID Connect authorization (type OPENID_CONNECT).
  AwsAppSyncOpenidConnectAuth openid_connect = 3;

  // Lambda authorizer (type AWS_LAMBDA).
  AwsAppSyncLambdaAuth lambda = 4;
}

// AwsAppSyncCognitoUserPoolAuth authorizes callers against a Cognito
// user pool.
message AwsAppSyncCognitoUserPoolAuth {
  // The user pool. Can reference an AwsCognitoUserPool resource or
  // pass a literal pool id.
  //
  // Containment-exempt: the API authorizes callers AGAINST the pool; it is
  // not deployed into it. On a diagram the pool is a room its clients and
  // identity providers live in, and the API stands outside with a line in.
  dev.planton.shared.foreignkey.v1.StringValueOrRef user_pool_id = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsCognitoUserPool,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.user_pool_id",
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true
  ];

  // A regex the caller's app client id must match. Unset means any
  // client in the pool.
  string app_id_client_regex = 2 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];

  // The user pool's region when it differs from the API's region.
  // Unset means the API's own region.
  string aws_region = 3 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];

  // What happens to requests that match no OTHER auth provider: ALLOW
  // passes them to this pool, DENY rejects them. REQUIRED on the
  // primary auth provider; forbidden on additionals (AWS's
  // asymmetry, enforced by CEL on the arm).
  string default_action = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "ALLOW",
        "DENY"
      ]
    }
  ];
}

// AwsAppSyncOpenidConnectAuth authorizes callers by OIDC tokens.
message AwsAppSyncOpenidConnectAuth {
  // The OIDC issuer URL the tokens must come from (matches the
  // token's iss claim).
  string issuer = 1 [(buf.validate.field).string.min_len = 1];

  // The client id the token's aud claim must match. Unset means any.
  string client_id = 2 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];

  // Milliseconds a token stays valid after its iat claim. Unset (0)
  // defers to the token's own exp.
  int64 iat_ttl = 3;

  // Milliseconds a token stays valid after authentication. Unset (0)
  // defers to the token's own exp.
  int64 auth_ttl = 4;
}

// AwsAppSyncLambdaAuth authorizes callers through a Lambda function
// you own.
message AwsAppSyncLambdaAuth {
  // The authorizer function. AppSync must be allowed to invoke it
  // (lambda:InvokeFunction from appsync.amazonaws.com). Can reference
  // an AwsLambda resource or pass a literal function/alias ARN.
  dev.planton.shared.foreignkey.v1.StringValueOrRef authorizer_uri = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsLambda,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.function_arn"
  ];

  // Seconds AppSync caches an authorizer response, 0-3600. Unset (0)
  // means no caching... except AWS's schema default is 300 when the
  // field is omitted entirely; the modules send the value only when
  // set, so 0 keeps AWS's default. Set 1-3600 to tune.
  int64 authorizer_result_ttl_in_seconds = 2 [(buf.validate.field).cel = {
    id: "lambda_auth.ttl_range"
    message: "authorizer_result_ttl_in_seconds must be between 0 and 3600"
    expression: "this >= 0 && this <= 3600"
  }];

  // A regex the token must match before AppSync bothers invoking the
  // authorizer (a cheap pre-filter).
  string identity_validation_expression = 3 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
}

// AwsAppSyncGraphqlLogConfig turns on CloudWatch request logging.
message AwsAppSyncGraphqlLogConfig {
  // The role AppSync assumes to write logs. Can reference an
  // AwsIamRole resource or pass a literal role ARN.
  dev.planton.shared.foreignkey.v1.StringValueOrRef cloudwatch_logs_role_arn = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsIamRole,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.role_arn"
  ];

  // How much of each request to log: NONE, ERROR, ALL, INFO, or
  // DEBUG.
  string field_log_level = 2 [(buf.validate.field).string = {
    in: [
      "NONE",
      "ERROR",
      "ALL",
      "INFO",
      "DEBUG"
    ]
  }];

  // Drop request/response bodies and headers from the logs (log
  // metadata only).
  bool exclude_verbose_content = 3;
}

// AwsAppSyncGraphqlEnhancedMetrics tunes CloudWatch metrics
// granularity. All three dials are required together (AWS's
// contract).
message AwsAppSyncGraphqlEnhancedMetrics {
  // Per-data-source metrics: FULL_REQUEST_DATA_SOURCE_METRICS (all
  // data sources) or PER_DATA_SOURCE_METRICS (only data sources whose
  // metrics_enabled is set - the provider exposes no per-data-source
  // flag at this pin, so FULL is the useful value).
  string data_source_level_metrics_behavior = 1 [(buf.validate.field).string = {
    in: [
      "FULL_REQUEST_DATA_SOURCE_METRICS",
      "PER_DATA_SOURCE_METRICS"
    ]
  }];

  // Operation-level metrics: ENABLED or DISABLED.
  string operation_level_metrics_config = 2 [(buf.validate.field).string = {
    in: [
      "ENABLED",
      "DISABLED"
    ]
  }];

  // Per-resolver metrics: FULL_REQUEST_RESOLVER_METRICS (all
  // resolvers) or PER_RESOLVER_METRICS.
  string resolver_level_metrics_behavior = 3 [(buf.validate.field).string = {
    in: [
      "FULL_REQUEST_RESOLVER_METRICS",
      "PER_RESOLVER_METRICS"
    ]
  }];
}

// AwsAppSyncGraphqlCache is the API's server-side response cache -
// a managed Redis-backed instance billed per hour while it exists.
message AwsAppSyncGraphqlCache {
  // What gets cached: FULL_REQUEST_CACHING (everything),
  // PER_RESOLVER_CACHING (only resolvers whose caching_config opts
  // in), or OPERATION_LEVEL_CACHING.
  string api_caching_behavior = 1 [(buf.validate.field).string = {
    in: [
      "FULL_REQUEST_CACHING",
      "PER_RESOLVER_CACHING",
      "OPERATION_LEVEL_CACHING"
    ]
  }];

  // Seconds cached entries live, 1-3600.
  int64 ttl = 2 [(buf.validate.field).cel = {
    id: "cache.ttl_range"
    message: "cache ttl must be between 1 and 3600 seconds"
    expression: "this >= 1 && this <= 3600"
  }];

  // The cache instance size. SMALL through LARGE_12X are the current
  // generation; T2_/R4_ names are the legacy generation AWS still
  // accepts.
  string type = 3 [(buf.validate.field).string = {
    in: [
      "SMALL",
      "MEDIUM",
      "LARGE",
      "XLARGE",
      "LARGE_2X",
      "LARGE_4X",
      "LARGE_8X",
      "LARGE_12X",
      "T2_SMALL",
      "T2_MEDIUM",
      "R4_LARGE",
      "R4_XLARGE",
      "R4_2XLARGE",
      "R4_4XLARGE",
      "R4_8XLARGE"
    ]
  }];

  // Encrypt cached responses at rest. Decided at cache creation -
  // changing it REPLACES the cache (a cold cache, not an outage).
  bool at_rest_encryption_enabled = 4;

  // Encrypt cache traffic in transit. Also replace-on-change.
  bool transit_encryption_enabled = 5;
}

// AwsAppSyncGraphqlType is one schema type managed individually.
message AwsAppSyncGraphqlType {
  // The type's name as declared inside definition - the for_each key
  // on both engines and part of the import ID. AWS derives the real
  // name from the definition; keep this field in sync with it (a
  // mismatch surfaces as a perpetual diff).
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    pattern: "^[A-Za-z_][0-9A-Za-z_]*$"
  }];

  // The type definition - SDL (format SDL) or introspection JSON
  // (format JSON). The text is CREATE-TIME: AWS rewrites it
  // server-side into its own whitespace form (indentation stripped,
  // braces re-placed, blank lines injected), so both engines ignore
  // the textual echo to keep plans converging. Editing the definition
  // body in place therefore does NOT propagate - to change a managed
  // type's definition, remove the entry, apply, and re-add it with
  // the new text (the same replace-the-entry choreography the format
  // field requires).
  string definition = 2 [(buf.validate.field).string.min_len = 1];

  // The definition's format. Fixed for life at AWS: the provider
  // ignores format changes on update (a perpetual-diff trap) -
  // replace the type entry instead.
  string format = 3 [(buf.validate.field).string = {
    in: [
      "SDL",
      "JSON"
    ]
  }];
}

// AwsAppSyncGraphqlFunction is one pipeline function - a reusable
// unit of resolver logic bound to a data source.
message AwsAppSyncGraphqlFunction {
  // A function is JavaScript (code) or VTL (mapping templates), never
  // both.
  option (buf.validate.message).cel = {
    id: "function.code_or_templates"
    message: "a function uses code (JavaScript) or request/response mapping templates (VTL), not both"
    expression: "this.code == '' || (this.request_mapping_template == '' && this.response_mapping_template == '')"
  };

  // The function's name - the for_each key, the function_ids output
  // key, and what resolvers reference in pipeline_functions. AWS
  // allows only letters, digits, and underscores.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    pattern: "^[A-Za-z_][0-9A-Za-z_]*$"
  }];

  // The data source this function operates on, by spec datasource
  // name (or the name of a data source created outside this
  // manifest).
  string data_source_name = 2 [(buf.validate.field).string.min_len = 1];

  // What this function does.
  string description = 3 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];

  // The function body as APPSYNC_JS JavaScript (the modern form).
  // When set, the modules pin the runtime to APPSYNC_JS at
  // runtime_version. 1-32768 characters.
  string code = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 32768
  ];

  // The APPSYNC_JS runtime version when code is set. Unset means
  // "1.0.0" (the only version AWS ships today).
  string runtime_version = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  ];

  // The VTL request mapping template (the legacy form; prefer code).
  // When templates are used, the modules pin AWS's required
  // functionVersion 2018-05-29.
  string request_mapping_template = 6 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];

  // The VTL response mapping template.
  string response_mapping_template = 7 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];

  // Maximum batch size for batched Lambda operations, 1-2000. Unset
  // (0) means no batching.
  int64 max_batch_size = 8 [(buf.validate.field).cel = {
    id: "function.max_batch_size_range"
    message: "max_batch_size must be between 1 and 2000 (0 = no batching)"
    expression: "this == 0 || (this >= 1 && this <= 2000)"
  }];

  // Versioned-data-source conflict detection and resolution.
  AwsAppSyncSyncConfig sync_config = 9;
}

// AwsAppSyncGraphqlResolver maps one schema field to data source
// operations.
message AwsAppSyncGraphqlResolver {
  // A resolver is UNIT (one data source) or PIPELINE (a function
  // chain), never both.
  option (buf.validate.message).cel = {
    id: "resolver.unit_xor_pipeline"
    message: "set exactly one of data_source_name (a UNIT resolver) and pipeline_functions (a PIPELINE resolver)"
    expression: "(this.data_source_name != '') != (this.pipeline_functions.size() > 0)"
  };
  // Same code-vs-templates wall as functions.
  option (buf.validate.message).cel = {
    id: "resolver.code_or_templates"
    message: "a resolver uses code (JavaScript) or request/response mapping templates (VTL), not both"
    expression: "this.code == '' || (this.request_template == '' && this.response_template == '')"
  };

  // The schema type the resolved field lives on (e.g. "Query",
  // "Mutation", or an object type). Fixed for life - the type.field
  // position IS the resolver's identity.
