  optional int32 idle_timeout_in_minutes = 1 [
    (buf.validate.field).int32.gte = 60,
    (buf.validate.field).int32.lte = 525600
  ];
}

// AwsSagemakerDomainSpaceCustomFileSystem mounts one existing EFS file system
