  // deployed inside it. On a diagram the domain stands in its VPC with a
  // line to the file system -- the verdict the domain-level
  // AwsSagemakerDomainEfsFileSystemConfig.file_system_id already carries.
  dev.planton.shared.foreignkey.v1.StringValueOrRef file_system_id = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsElasticFileSystem,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.file_system_id"
  ];
}

// AwsSagemakerDomainSpaceStorage is a space's EBS volume sizing (the space
// form is a single concrete size — the domain baseline's default/maximum pair
// governs what spaces may pick).
message AwsSagemakerDomainSpaceStorage {
  // The EBS volume size in GB. Range: 5-16384.
  int32 ebs_volume_size_in_gb = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32.gte = 5,
    (buf.validate.field).int32.lte = 16384
  ];
}

// AwsSagemakerDomainJupyterLabAppSettings configures the JupyterLab IDE.
// JupyterLab is the recommended primary IDE for SageMaker Studio, providing notebooks,
