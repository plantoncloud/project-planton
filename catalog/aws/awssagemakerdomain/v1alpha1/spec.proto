  // register into this account's registry.
  string cross_account_model_register_role_arn = 1;

  // status enables or disables model registration ("ENABLED" or "DISABLED").
  string status = 2;

  // --- Cross-field validations ---

  option (buf.validate.message).cel = {
    id: "status_valid"
    message: "status must be 'ENABLED' or 'DISABLED'"
    expression: "this.status == '' || this.status in ['ENABLED', 'DISABLED']"
  };
}

// AwsSagemakerDomainCanvasTimeSeriesForecastingSettings enables Canvas time-series
// forecasting, which calls Amazon Forecast through the given IAM role.
message AwsSagemakerDomainCanvasTimeSeriesForecastingSettings {
  // amazon_forecast_role_arn is the IAM role Canvas assumes to call Amazon Forecast.
  dev.planton.shared.foreignkey.v1.StringValueOrRef amazon_forecast_role_arn = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsIamRole,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.role_arn"
  ];

  // status enables or disables forecasting ("ENABLED" or "DISABLED").
  string status = 2;

  // --- Cross-field validations ---

  option (buf.validate.message).cel = {
    id: "status_valid"
    message: "status must be 'ENABLED' or 'DISABLED'"
    expression: "this.status == '' || this.status in ['ENABLED', 'DISABLED']"
  };
}

// AwsSagemakerDomainCanvasWorkspaceSettings pins where Canvas stores its working
// artifacts.
message AwsSagemakerDomainCanvasWorkspaceSettings {
  // s3_artifact_path is the S3 URI where Canvas stores datasets, intermediate results,
  // and generated models. Example: "s3://my-canvas-workspace/artifacts/".
  string s3_artifact_path = 1 [(buf.validate.field).string.max_len = 1024];

  // s3_kms_key_id is the KMS key used to encrypt Canvas artifacts in S3.
  dev.planton.shared.foreignkey.v1.StringValueOrRef s3_kms_key_id = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsKmsKey,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.key_arn"
  ];

  // --- Cross-field validations ---

  option (buf.validate.message).cel = {
    id: "s3_artifact_path_format"
    message: "s3_artifact_path must be an s3:// or https:// URI"
    expression: "this.s3_artifact_path == '' || this.s3_artifact_path.startsWith('s3://') || this.s3_artifact_path.startsWith('https://')"
  };
}

// AwsSagemakerDomainResourceSpec defines the default compute and image configuration for an
// app type. This shared structure is used by JupyterLab, KernelGateway, Code Editor,
// TensorBoard, RSession, RStudio, and Jupyter Server app settings.
message AwsSagemakerDomainResourceSpec {
  // instance_type is the EC2 instance type for the app's compute.
  // Common choices:
  //   "ml.t3.medium" - development/exploration (2 vCPU, 4 GB)
  //   "ml.m5.large" - general-purpose notebooks (2 vCPU, 8 GB)
  //   "ml.g4dn.xlarge" - GPU workloads (1 GPU, 4 vCPU, 16 GB)
  //   "ml.p3.2xlarge" - heavy training (1 V100 GPU, 8 vCPU, 61 GB)
  //   "system" - lightweight system-managed instance for JupyterServer
  // The shape is checked here ("system" or an "ml."-prefixed type) so a typo
  // fails at manifest time; membership in AWS's instance-type list grows with
  // every hardware launch and is validated by AWS at deploy time.
  string instance_type = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^(system|ml\\.[a-z0-9]+(\\.[a-z0-9]+)+)$"
  ];

  // lifecycle_config_arn is the ARN of a lifecycle configuration script that runs
  // when this specific app type starts.
  string lifecycle_config_arn = 2;

  // sagemaker_image_arn is the ARN of a SageMaker Image that defines the app's container.
  // Use this to specify a custom base image instead of the SageMaker-provided default.
  string sagemaker_image_arn = 3;

  // sagemaker_image_version_alias is a human-readable alias for a specific image version
  // (e.g., "latest", "v2.0"). Mutually exclusive with sagemaker_image_version_arn.
  string sagemaker_image_version_alias = 4;

  // sagemaker_image_version_arn is the ARN of a specific SageMaker image version.
  // Pins the app to an exact image version for reproducibility across team members.
  // Mutually exclusive with sagemaker_image_version_alias.
  string sagemaker_image_version_arn = 5;

  // --- Cross-field validations ---

  option (buf.validate.message).cel = {
    id: "image_version_alias_xor_arn"
    message: "sagemaker_image_version_alias and sagemaker_image_version_arn are mutually exclusive"
    expression: "this.sagemaker_image_version_alias == '' || this.sagemaker_image_version_arn == ''"
  };
}

// AwsSagemakerDomainCustomImage defines a custom Docker image available as a kernel
// in SageMaker Studio. Custom images enable teams to standardize on specific ML framework
// versions, proprietary libraries, or GPU-optimized environments.
message AwsSagemakerDomainCustomImage {
  // app_image_config_name is the name of the SageMaker AppImageConfig that defines how
  // the image is presented to users (kernel specifications, file system configuration).
  // The AppImageConfig must exist before referencing it here.
  string app_image_config_name = 1 [(buf.validate.field).required = true];

  // image_name is the name of the SageMaker Image resource that contains this container image.
  // The Image resource must exist before referencing it here.
  string image_name = 2 [(buf.validate.field).required = true];

  // image_version_number pins to a specific version of the image.
  // If omitted, the latest available version is used.
  optional int32 image_version_number = 3;
}

// AwsSagemakerDomainCodeRepository defines a Git repository automatically cloned into
// the app on startup, providing immediate access to team code and shared notebooks.
message AwsSagemakerDomainCodeRepository {
  // repository_url is the HTTPS URL of the Git repository to clone.
  // Must be an HTTPS URL (SSH URLs are not supported by SageMaker).
  // Examples: "https://github.com/org/ml-notebooks.git"
  // Maximum length: 1024 characters.
  string repository_url = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 1024
  ];
}

// AwsSagemakerDomainIdleSettings configures automatic shutdown of idle app instances.
// Idle detection is based on user activity: notebook cell execution, terminal commands,
// file operations, and UI interactions. When no activity is detected for the configured
// timeout period, the instance is automatically stopped, releasing compute resources.
//
// The presence of this message IS the enable switch: configuring it turns idle shutdown
// on, and omitting it leaves instances running until manually stopped. All three
// timeouts are required whenever the block is set -- AWS transmits absent members as 0
// and rejects the request ("Member must have value greater than or equal to 60"), so a
// partial block can never deploy.
message AwsSagemakerDomainIdleSettings {
  // lifecycle_management is the enforcement switch: "ENABLED" (the default when
  // this block is present) turns automatic idle shutdown on; "DISABLED" keeps
  // the block's timeout values as published guardrails users may adopt WITHOUT
  // forcing auto-shutdown on — the defined-but-disabled state. Both engines
  // send the explicit value, so flipping to "DISABLED" genuinely turns
  // enforcement off.
  optional string lifecycle_management = 4 [(dev.planton.shared.options.default) = "ENABLED"];

  // idle_timeout_in_minutes is the duration of inactivity (in minutes) before an instance
  // is automatically shut down. Range: 60-525600 (1 hour to 365 days).
  // A reasonable production default is 120 (2 hours).
  int32 idle_timeout_in_minutes = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32.gte = 60,
    (buf.validate.field).int32.lte = 525600
  ];

  // min_idle_timeout_in_minutes sets the minimum idle timeout that individual users can
  // configure for their own apps. Prevents users from setting excessively short timeouts
  // that would cause disruptive shutdowns during brief pauses. Range: 60-525600.
  int32 min_idle_timeout_in_minutes = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32.gte = 60,
    (buf.validate.field).int32.lte = 525600
  ];

  // max_idle_timeout_in_minutes sets the maximum idle timeout that individual users can
  // configure. Prevents users from effectively disabling idle shutdown by setting
  // extremely long timeouts. Range: 60-525600.
  int32 max_idle_timeout_in_minutes = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32.gte = 60,
    (buf.validate.field).int32.lte = 525600
  ];

  // --- Cross-field validations ---

  option (buf.validate.message).cel = {
    id: "max_gte_min"
    message: "max_idle_timeout_in_minutes must be >= min_idle_timeout_in_minutes"
    expression: "this.max_idle_timeout_in_minutes >= this.min_idle_timeout_in_minutes"
  };

  option (buf.validate.message).cel = {
    id: "lifecycle_management_valid"
    message: "lifecycle_management must be 'ENABLED' or 'DISABLED'"
    expression: "!has(this.lifecycle_management) || this.lifecycle_management in ['ENABLED', 'DISABLED']"
  };
}

// AwsSagemakerDomainEmrSettings pre-authorizes the IAM roles JupyterLab uses to discover,
// connect to, and run workloads on Amazon EMR clusters directly from notebooks.
message AwsSagemakerDomainEmrSettings {
  // assumable_role_arns are IAM roles the JupyterLab app can assume to CONNECT to EMR
  // clusters -- including clusters in other AWS accounts (cross-account access).
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef assumable_role_arns = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsIamRole,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.role_arn"
  ];

  // execution_role_arns are IAM runtime roles available for EMR workloads submitted from
  // the notebook (the role the EMR job itself runs under).
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef execution_role_arns = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsIamRole,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.role_arn"
  ];
}

// AwsSagemakerDomainSharingSettings controls notebook output sharing to S3.
// When enabled, notebook cell outputs (plots, tables, printed results) are automatically
// persisted to an S3 location, allowing team members to view results without running
// the notebook themselves -- useful for review workflows and audit trails.
message AwsSagemakerDomainSharingSettings {
  // notebook_output_option controls whether notebook cell outputs are persisted to S3.
  // "Allowed": outputs are copied to S3 at the location specified by s3_output_path.
  // "Disabled" (default): outputs are not shared externally.
  optional string notebook_output_option = 1 [(dev.planton.shared.options.default) = "Disabled"];

  // s3_kms_key_id is the KMS key used to encrypt shared notebook outputs in S3.
  // If omitted, outputs are encrypted with the default S3 bucket encryption.
  dev.planton.shared.foreignkey.v1.StringValueOrRef s3_kms_key_id = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsKmsKey,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.key_arn"
  ];

  // s3_output_path is the S3 URI where shared notebook outputs are stored.
  // Required when notebook_output_option is "Allowed".
  // Example: "s3://my-team-bucket/notebook-outputs/"
  string s3_output_path = 3;

  // --- Cross-field validations ---

  option (buf.validate.message).cel = {
    id: "notebook_output_option_valid"
    message: "notebook_output_option must be 'Allowed' or 'Disabled'"
    expression: "!has(this.notebook_output_option) || this.notebook_output_option in ['Allowed', 'Disabled']"
  };

  option (buf.validate.message).cel = {
    id: "s3_output_path_required_when_allowed"
    message: "s3_output_path is required when notebook_output_option is 'Allowed'"
    expression: "!has(this.notebook_output_option) || this.notebook_output_option != 'Allowed' || this.s3_output_path != ''"
  };
}

// AwsSagemakerDomainSpaceStorageSettings configures default EBS volume sizes for user spaces.
// Spaces use EBS volumes for fast working storage (code checkouts, intermediate training data,
// model artifacts) beyond the shared EFS home directory.
message AwsSagemakerDomainSpaceStorageSettings {
  // default_ebs_volume_size_in_gb is the default EBS volume size (in GB) assigned to new spaces.
  int32 default_ebs_volume_size_in_gb = 1 [(buf.validate.field).required = true];

  // maximum_ebs_volume_size_in_gb is the maximum EBS volume size (in GB) that users can request
  // for their spaces. Must be >= default_ebs_volume_size_in_gb.
  int32 maximum_ebs_volume_size_in_gb = 2 [(buf.validate.field).required = true];

  // --- Cross-field validations ---

  option (buf.validate.message).cel = {
    id: "max_ebs_gte_default"
    message: "maximum_ebs_volume_size_in_gb must be >= default_ebs_volume_size_in_gb"
    expression: "this.maximum_ebs_volume_size_in_gb >= this.default_ebs_volume_size_in_gb"
  };
}

// AwsSagemakerDomainCustomFileSystemConfig mounts one additional file system into apps.
// The AWS API models this as a union of file-system types; EFS is the type SageMaker
// domains support today, and new types slot in as additional arms of this message.
message AwsSagemakerDomainCustomFileSystemConfig {
  // efs_file_system_config mounts an Amazon EFS file system.
  AwsSagemakerDomainEfsFileSystemConfig efs_file_system_config = 1 [(buf.validate.field).required = true];
}

// AwsSagemakerDomainEfsFileSystemConfig identifies an EFS file system and the path where
// it mounts inside apps.
message AwsSagemakerDomainEfsFileSystemConfig {
  // file_system_id is the EFS file system to mount. The file system must be reachable
  // from the domain's subnets (mount targets + security groups are the file system's
  // own configuration).
  dev.planton.shared.foreignkey.v1.StringValueOrRef file_system_id = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsElasticFileSystem,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.file_system_id"
  ];

  // file_system_path is the path within the EFS file system to mount into apps.
  // Example: "/shared/datasets"
  string file_system_path = 2 [(buf.validate.field).required = true];
}

// AwsSagemakerDomainCustomPosixUserConfig sets the POSIX identity (UID/GID) that apps run
// as when accessing the EFS home directory and custom file systems.
message AwsSagemakerDomainCustomPosixUserConfig {
  // uid is the POSIX user ID. Must be at least 10000.
  int64 uid = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gte = 10000
  ];

  // gid is the POSIX group ID. Must be at least 1001.
  int64 gid = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gte = 1001
  ];
}

// AwsSagemakerDomainStudioWebPortalSettings hides parts of the Studio UI from users.
// Hiding is a UI-governance dial (keeping expensive instance types or unused tools out of
// the picker); it is not an IAM-level control.
message AwsSagemakerDomainStudioWebPortalSettings {
  // hidden_app_types are Studio app types to hide (e.g. "JupyterServer", "KernelGateway",
  // "Canvas", "CodeEditor", "JupyterLab", "TensorBoard", "RStudioServerPro"). Values are
  // SageMaker AppType names; AWS validates them at deploy time as the set grows.
  repeated string hidden_app_types = 1;

  // hidden_instance_types are instance types to hide from app-creation pickers
  // (e.g. "ml.p3.2xlarge"). Values are SageMaker app instance type names.
  repeated string hidden_instance_types = 2;

  // hidden_ml_tools are Studio ML tools to hide (e.g. "DataWrangler", "FeatureStore",
  // "EmrClusters", "AutoMl", "Experiments", "Pipelines"). Values are SageMaker MlTools
  // names; AWS validates them at deploy time as the set grows.
  repeated string hidden_ml_tools = 3;
}

// AwsSagemakerDomainDockerSettings controls Docker access within the SageMaker Domain.
// Docker access enables users to build custom training containers, test inference images,
// and create reproducible ML pipelines directly within their Studio environment.
message AwsSagemakerDomainDockerSettings {
  // enable_docker_access controls whether users can build and run Docker containers
  // in their notebooks and terminals.
  // "ENABLED": Docker commands (build, pull, run) are available.
  // "DISABLED": Docker access is blocked.
  string enable_docker_access = 1;

  // vpc_only_trusted_accounts restricts Docker image pulling to images from specified
  // AWS account IDs when app_network_access_type is "VpcOnly". This prevents users from
  // pulling arbitrary images from public registries, enforcing approved image sources.
  // Maximum 20 account IDs, each exactly 12 digits — a malformed entry would make this
  // security control silently not match the intended account.
  repeated string vpc_only_trusted_accounts = 2 [
    (buf.validate.field).repeated.max_items = 20,
    (buf.validate.field).repeated.items = {
      string: {pattern: "^[0-9]{12}$"}
    }
  ];

  // --- Cross-field validations ---

  option (buf.validate.message).cel = {
    id: "enable_docker_access_valid"
    message: "enable_docker_access must be 'ENABLED' or 'DISABLED'"
    expression: "this.enable_docker_access == '' || this.enable_docker_access in ['ENABLED', 'DISABLED']"
  };
}
