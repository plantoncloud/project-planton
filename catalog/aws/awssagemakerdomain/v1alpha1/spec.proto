  AwsSagemakerDomainResourceSpec default_resource_spec = 1;

  // lifecycle_config_arns are ARNs of lifecycle configuration scripts for the
  // Jupyter Server app.
  repeated string lifecycle_config_arns = 2;

  // code_repositories are Git repositories automatically cloned on startup.
  // Maximum 10 repositories.
  repeated AwsSagemakerDomainCodeRepository code_repositories = 3 [(buf.validate.field).repeated.max_items = 10];
}

