syntax = "proto3";

package dev.planton.aws.awseventbridgepipe.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// AwsEventBridgePipeSpec defines one EventBridge Pipe: a managed
// point-to-point integration that reads from ONE source, optionally
// filters and enriches events in flight, and delivers to ONE target -
// no event bus in between.
//
// The pipe's name in AWS is metadata.name. The SOURCE is fixed for
// life (changing it replaces the pipe, resetting consumer positions);
// the TARGET swaps in place. The execution role must allow the pipe to
// read the source and write the target - its trust policy allows
// pipes.amazonaws.com.
//
// Source and target ARNs range over many services (SQS, Kinesis,
// DynamoDB streams, Kafka, MQ on the source side; 16+ services on the
// target side), so no single kind dominates - references on those
// fields carry NO default kind, and a valueFrom in a manifest must
// state its kind explicitly.
//
// Pipes bill per event processed - an idle pipe on an empty source
// costs nothing at rest. desired_state STOPPED pauses consumption
// without losing the pipe (creates and state flips can take minutes;
// the provider waits up to 30).
message AwsEventBridgePipeSpec {
  // Enrichment parameters shape the enrichment call.
  option (buf.validate.message).cel = {
    id: "spec.enrichment_parameters_require_enrichment"
    message: "enrichment_parameters shape the enrichment invocation - configure enrichment or drop them"
    expression: "!has(this.enrichment_parameters) || has(this.enrichment)"
  };

  // The AWS region the pipe lives in. Example: "us-east-1".
  string region = 1 [(buf.validate.field).string.min_len = 1];

  // What this pipe moves and why.
  string description = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 512
  ];

  // The source's ARN: an SQS queue, Kinesis stream, DynamoDB stream,
  // MSK topic, self-managed Kafka cluster, or ActiveMQ/RabbitMQ
  // broker. FIXED FOR LIFE - changing the source replaces the whole
  // pipe. References here carry no default kind: state the kind
  // explicitly in valueFrom.
  dev.planton.shared.foreignkey.v1.StringValueOrRef source = 3 [(buf.validate.field).required = true];

  // Source-family tuning (batching, positions, credentials) plus the
  // event filter. The family block must match the source's service;
  // AWS applies service defaults when unset.
  AwsEventBridgePipeSourceParameters source_parameters = 4;

  // The enrichment step's ARN: a Lambda function, Step Functions
  // express state machine, or API destination that transforms each
  // batch before delivery. Unset skips enrichment. References here
  // carry no default kind: state the kind explicitly in valueFrom.
  dev.planton.shared.foreignkey.v1.StringValueOrRef enrichment = 5;

  // HTTP shaping (for API-destination enrichment) and the input
  // template applied before the enrichment call.
  AwsEventBridgePipeEnrichmentParameters enrichment_parameters = 6;

  // The target's ARN: an ECS cluster, Batch job queue, Lambda
  // function, Step Functions state machine, Kinesis stream, SQS queue,
  // Redshift cluster, SageMaker pipeline, CloudWatch log group,
  // EventBridge bus, or API destination. Swaps in place. References
  // here carry no default kind: state the kind explicitly in
  // valueFrom.
  dev.planton.shared.foreignkey.v1.StringValueOrRef target = 7 [(buf.validate.field).required = true];

  // Target-family invocation shaping plus the input template applied
  // before delivery. The family block must match the target's service.
  AwsEventBridgePipeTargetParameters target_parameters = 8;

  // The role the pipe assumes to read the source, call the enrichment,
  // and write the target. Trust policy allows pipes.amazonaws.com.
  // Reference an AwsIamRole role_arn output or pass a literal ARN.
  dev.planton.shared.foreignkey.v1.StringValueOrRef role_arn = 9 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsIamRole,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.role_arn"
  ];

  // RUNNING consumes and delivers; STOPPED pauses consumption without
  // deleting the pipe (stream positions are kept). Unset keeps AWS's
  // default (RUNNING).
  string desired_state = 10 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "RUNNING",
        "STOPPED"
      ]
    }
  ];

  // Customer-managed KMS key that encrypts pipe data at rest (unset
  // uses AWS-owned keys). Reference an AwsKmsKey key_arn output or
  // pass a literal key id/ARN/alias.
  dev.planton.shared.foreignkey.v1.StringValueOrRef kms_key_identifier = 11 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsKmsKey,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.key_arn"
  ];

  // Execution logging: level plus one or more destinations (CloudWatch
  // Logs, Firehose, S3). Unset disables pipe logging.
  AwsEventBridgePipeLogConfiguration log_configuration = 12;
}

// ---------------------------------------------------------------------------
// Source parameters
// ---------------------------------------------------------------------------

// AwsEventBridgePipeSourceParameters tunes how the pipe reads its
// source: exactly one service-family block (matching the source ARN's
// service), plus the orthogonal event filter.
message AwsEventBridgePipeSourceParameters {
  // The family blocks are alternatives - the one that matches the
  // source's service.
  option (buf.validate.message).cel = {
    id: "source_parameters.at_most_one_family"
    message: "configure at most one source family block (sqs, kinesis, dynamodb, msk, self_managed_kafka, activemq, rabbitmq) - it must match the source arn's service"
    expression: "[has(this.sqs), has(this.kinesis), has(this.dynamodb), has(this.msk), has(this.self_managed_kafka), has(this.activemq), has(this.rabbitmq)].filter(x, x).size() <= 1"
  };

  // Event filter: only events matching at least one pattern reach the
  // enrichment/target (and only matching events bill). At most 5
  // patterns, each in EventBridge pattern syntax.
  AwsEventBridgePipeFilterCriteria filter_criteria = 1;

  // SQS source tuning.
  AwsEventBridgePipeSqsSourceParameters sqs = 2;

  // Kinesis stream source tuning.
  AwsEventBridgePipeKinesisSourceParameters kinesis = 3;

  // DynamoDB stream source tuning.
  AwsEventBridgePipeDynamoDbSourceParameters dynamodb = 4;

  // Amazon MSK source tuning.
  AwsEventBridgePipeMskSourceParameters msk = 5;

  // Self-managed Apache Kafka source tuning.
  AwsEventBridgePipeSelfManagedKafkaSourceParameters self_managed_kafka = 6;

  // ActiveMQ broker source tuning.
  AwsEventBridgePipeActiveMqSourceParameters activemq = 7;

  // RabbitMQ broker source tuning.
  AwsEventBridgePipeRabbitMqSourceParameters rabbitmq = 8;
}

// AwsEventBridgePipeFilterCriteria is the pipe's event filter.
message AwsEventBridgePipeFilterCriteria {
  // The filter patterns (OR-ed; at most 5), each an EventBridge event
  // pattern JSON document. Example: {"body":{"type":["order"]}}.
  repeated AwsEventBridgePipeFilter filters = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 5
  }];
}

// AwsEventBridgePipeFilter is one filter pattern.
message AwsEventBridgePipeFilter {
  // The EventBridge event pattern (JSON, up to 4096 characters).
  string pattern = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];
}

// AwsEventBridgePipeSqsSourceParameters tunes an SQS source.
message AwsEventBridgePipeSqsSourceParameters {
  // Events per batch (1-10000; FIFO queues cap at 10). Unset keeps
  // AWS's default (10).
  optional int32 batch_size = 1 [(buf.validate.field).int32 = {
    gte: 1
    lte: 10000
  }];

  // How long to gather a batch before invoking (0-300 seconds).
  optional int32 maximum_batching_window_in_seconds = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 300
  }];
}

// AwsEventBridgePipeKinesisSourceParameters tunes a Kinesis stream
// source.
message AwsEventBridgePipeKinesisSourceParameters {
  // AT_TIMESTAMP needs its timestamp; the other positions forbid it.
  option (buf.validate.message).cel = {
    id: "kinesis.timestamp_matches_position"
    message: "starting_position AT_TIMESTAMP requires starting_position_timestamp; TRIM_HORIZON/LATEST forbid it"
    expression: "(this.starting_position == 'AT_TIMESTAMP') == (this.starting_position_timestamp != '')"
  };

  // Where a NEW pipe starts reading. FIXED FOR LIFE - changing it
  // replaces the pipe.
  string starting_position = 1 [(buf.validate.field).string = {
    in: [
      "TRIM_HORIZON",
      "LATEST",
      "AT_TIMESTAMP"
    ]
  }];

  // The instant to start from (RFC3339), with AT_TIMESTAMP. Fixed for
  // life.
  string starting_position_timestamp = 2 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];

  // Events per batch (1-10000). Unset keeps AWS's default (100).
  optional int32 batch_size = 3 [(buf.validate.field).int32 = {
    gte: 1
    lte: 10000
  }];

  // How long to gather a batch before invoking (0-300 seconds).
  optional int32 maximum_batching_window_in_seconds = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 300
  }];

  // Discard records older than this (60-604800 seconds; -1 never
  // discards). Unset keeps AWS's default (-1).
  optional int32 maximum_record_age_in_seconds = 5 [(buf.validate.field).int32 = {
    gte: -1
    lte: 604800
  }];

  // Retry a failed batch at most this many times (-1 retries until
  // the records expire). Unset keeps AWS's default (-1).
  optional int32 maximum_retry_attempts = 6 [(buf.validate.field).int32 = {
    gte: -1
    lte: 10000
  }];

  // On a partial batch failure, AUTOMATIC_BISECT splits the batch and
  // retries the halves. Unset retries the whole batch.
  string on_partial_batch_item_failure = 7 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: ["AUTOMATIC_BISECT"]
    }
  ];

  // Concurrent batches per shard (1-10). Unset keeps AWS's default
  // (1).
  optional int32 parallelization_factor = 8 [(buf.validate.field).int32 = {
    gte: 1
    lte: 10
  }];

  // Where records land after retries are exhausted (an SQS queue or
  // SNS topic ARN). Reference an AwsSqsQueue queue_arn output or pass
  // a literal ARN.
  dev.planton.shared.foreignkey.v1.StringValueOrRef dead_letter_queue_arn = 9 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSqsQueue,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.queue_arn"
  ];
}

// AwsEventBridgePipeDynamoDbSourceParameters tunes a DynamoDB stream
// source.
message AwsEventBridgePipeDynamoDbSourceParameters {
  // Where a NEW pipe starts reading. FIXED FOR LIFE - changing it
