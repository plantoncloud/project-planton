// ---------------------------------------------------------------------------
// Enrichment parameters
// ---------------------------------------------------------------------------

// AwsEventBridgePipeEnrichmentParameters shapes the enrichment call.
message AwsEventBridgePipeEnrichmentParameters {
  // The input template applied to each event BEFORE the enrichment
  // call (up to 8192 characters; static text with <$.json.path>
  // placeholders).
  string input_template = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 8192
  ];

  // HTTP shaping when the enrichment is an API destination.
  AwsEventBridgePipeHttpParameters http_parameters = 2;
}

// AwsEventBridgePipeHttpParameters shapes an API-destination call
// (headers, path wildcards, query string).
message AwsEventBridgePipeHttpParameters {
  // Headers added to the request.
  map<string, string> header_parameters = 1;

  // The value filling the destination URL's "*" path wildcard. (AWS's
  // API models this as a list but accepts exactly ONE entry.)
  string path_parameter_value = 2 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];

  // Query-string parameters added to the request.
  map<string, string> query_string_parameters = 3;
}

// ---------------------------------------------------------------------------
// Target parameters
// ---------------------------------------------------------------------------

// AwsEventBridgePipeTargetParameters shapes delivery: an optional
// input template plus at most one service-family block matching the
// target's service.
message AwsEventBridgePipeTargetParameters {
  // The family blocks are alternatives - the one that matches the
  // target's service.
  option (buf.validate.message).cel = {
    id: "target_parameters.at_most_one_family"
    message: "configure at most one target family block (sqs, kinesis, lambda, step_function, ecs_task, batch_job, redshift_data, sagemaker_pipeline, eventbridge_event_bus, cloudwatch_logs, http) - it must match the target arn's service"
