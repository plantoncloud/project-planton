  string starting_position = 1 [(buf.validate.field).string = {
    in: [
      "TRIM_HORIZON",
      "LATEST"
    ]
  }];

  // Events per batch (1-10000). Unset keeps AWS's default (100).
  optional int32 batch_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 10000
  }];

  // How long to gather a batch before invoking (0-300 seconds).
  optional int32 maximum_batching_window_in_seconds = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 300
  }];

  // Discard records older than this (60-604800 seconds; -1 never
  // discards). Unset keeps AWS's default (-1).
  optional int32 maximum_record_age_in_seconds = 4 [(buf.validate.field).int32 = {
    gte: -1
    lte: 604800
  }];

  // Retry a failed batch at most this many times (-1 retries until
  // the records expire). Unset keeps AWS's default (-1).
  optional int32 maximum_retry_attempts = 5 [(buf.validate.field).int32 = {
    gte: -1
    lte: 10000
  }];

  // On a partial batch failure, AUTOMATIC_BISECT splits the batch and
  // retries the halves. Unset retries the whole batch.
  string on_partial_batch_item_failure = 6 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: ["AUTOMATIC_BISECT"]
    }
  ];

  // Concurrent batches per shard (1-10). Unset keeps AWS's default
  // (1).
  optional int32 parallelization_factor = 7 [(buf.validate.field).int32 = {
    gte: 1
    lte: 10
  }];

  // Where records land after retries are exhausted (an SQS queue or
  // SNS topic ARN). Reference an AwsSqsQueue queue_arn output or pass
  // a literal ARN.
  dev.planton.shared.foreignkey.v1.StringValueOrRef dead_letter_queue_arn = 8 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSqsQueue,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.queue_arn"
  ];
}

// AwsEventBridgePipeMskSourceParameters tunes an Amazon MSK source.
message AwsEventBridgePipeMskSourceParameters {
  // The topic to read (1-249 characters, Kafka topic charset). FIXED
  // FOR LIFE - changing it replaces the pipe.
  string topic_name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 249
    pattern: "^[^.]([0-9A-Za-z_.-]+)$"
  }];

  // The Kafka consumer group id (up to 200 characters). Unset lets
  // AWS generate one.
  string consumer_group_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 200
  ];

  // Where a NEW pipe starts reading. Fixed for life.
  string starting_position = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "TRIM_HORIZON",
        "LATEST"
      ]
    }
  ];

  // Events per batch (1-10000). Unset keeps AWS's default (100).
  optional int32 batch_size = 4 [(buf.validate.field).int32 = {
    gte: 1
    lte: 10000
  }];

  // How long to gather a batch before invoking (0-300 seconds).
  optional int32 maximum_batching_window_in_seconds = 5 [(buf.validate.field).int32 = {
    gte: 0
    lte: 300
  }];

  // Broker credentials, as the ARN of the Secrets Manager secret
  // holding them - a reference, never the credential value itself.
  AwsEventBridgePipeMskCredentials credentials = 6;
}

// AwsEventBridgePipeMskCredentials selects the MSK auth mechanism.
message AwsEventBridgePipeMskCredentials {
  // Exactly one mechanism.
  option (buf.validate.message).cel = {
    id: "msk_credentials.exactly_one"
    message: "set exactly one of client_certificate_tls_auth and sasl_scram_512_auth"
    expression: "(this.client_certificate_tls_auth != '') != (this.sasl_scram_512_auth != '')"
  };

  // Secrets Manager secret ARN holding the client TLS certificate.
  string client_certificate_tls_auth = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^arn:aws.*:secretsmanager:.*$"
  ];

  // Secrets Manager secret ARN holding the SASL/SCRAM-512 credentials.
  string sasl_scram_512_auth = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^arn:aws.*:secretsmanager:.*$"
  ];
}

// AwsEventBridgePipeSelfManagedKafkaSourceParameters tunes a
// self-managed Apache Kafka source.
message AwsEventBridgePipeSelfManagedKafkaSourceParameters {
  // The topic to read (1-249 characters, Kafka topic charset). FIXED
  // FOR LIFE.
  string topic_name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 249
    pattern: "^[^.]([0-9A-Za-z_.-]+)$"
  }];

  // Extra bootstrap "host:port" endpoints beyond the source ARN's (at
  // most 2). Fixed for life.
  repeated string additional_bootstrap_servers = 2 [(buf.validate.field).repeated = {
    max_items: 2
    items: {
      string: {
        min_len: 1
        max_len: 300
      }
    }
  }];

  // The Kafka consumer group id (up to 200 characters). FIXED FOR
  // LIFE on self-managed Kafka (unlike MSK).
  string consumer_group_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 200
  ];

  // Where a NEW pipe starts reading. Fixed for life.
  string starting_position = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "TRIM_HORIZON",
        "LATEST"
      ]
    }
  ];

  // Events per batch (1-10000). Unset keeps AWS's default (100).
  optional int32 batch_size = 5 [(buf.validate.field).int32 = {
    gte: 1
    lte: 10000
  }];

  // How long to gather a batch before invoking (0-300 seconds).
  optional int32 maximum_batching_window_in_seconds = 6 [(buf.validate.field).int32 = {
    gte: 0
    lte: 300
  }];

  // Broker credentials, as the ARN of the Secrets Manager secret
  // holding them - a reference, never the credential value itself.
  AwsEventBridgePipeSelfManagedKafkaCredentials credentials = 7;

  // Secrets Manager secret ARN holding the brokers' root CA
  // certificate, for private CAs.
  string server_root_ca_certificate = 8 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^arn:aws.*$"
  ];

  // VPC placement for reaching brokers on private networks.
  AwsEventBridgePipeSelfManagedKafkaVpc vpc = 9;
}

// AwsEventBridgePipeSelfManagedKafkaCredentials selects the
// self-managed Kafka auth mechanism.
message AwsEventBridgePipeSelfManagedKafkaCredentials {
  // Exactly one mechanism.
  option (buf.validate.message).cel = {
    id: "smk_credentials.exactly_one"
    message: "set exactly one of basic_auth, client_certificate_tls_auth, sasl_scram_256_auth, and sasl_scram_512_auth"
    expression: "[this.basic_auth != '', this.client_certificate_tls_auth != '', this.sasl_scram_256_auth != '', this.sasl_scram_512_auth != ''].filter(x, x).size() == 1"
  };

  // Secrets Manager secret ARN holding SASL/PLAIN credentials.
  string basic_auth = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^arn:aws.*:secretsmanager:.*$"
  ];

  // Secrets Manager secret ARN holding the client TLS certificate.
  string client_certificate_tls_auth = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^arn:aws.*:secretsmanager:.*$"
  ];

  // Secrets Manager secret ARN holding SASL/SCRAM-256 credentials.
  string sasl_scram_256_auth = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^arn:aws.*:secretsmanager:.*$"
  ];

  // Secrets Manager secret ARN holding SASL/SCRAM-512 credentials.
  string sasl_scram_512_auth = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^arn:aws.*:secretsmanager:.*$"
  ];
}

// AwsEventBridgePipeSelfManagedKafkaVpc places the pipe's Kafka client
// in a VPC.
message AwsEventBridgePipeSelfManagedKafkaVpc {
  // The subnets the client uses (at most 16). Reference AwsSubnet
  // subnet_id outputs or pass literal subnet-... ids.
  //
  // Containment-exempt: the pipe is a managed service that reaches INTO
  // the VPC to poll the brokers; it is not deployed into the subnets. On a
  // diagram the pipe stands outside the network with a line in -- the same
  // verdict a Lambda function's VPC subnets carry.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef subnets = 1 [
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 16
    },
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSubnet,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.subnet_id",
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true
  ];

  // The security groups attached to the client (at most 5). Reference
  // AwsSecurityGroup security_group_id outputs or pass literal sg-...
  // ids.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef security_groups = 2 [
    (buf.validate.field).repeated.max_items = 5,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSecurityGroup,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.security_group_id"
  ];
}

// AwsEventBridgePipeActiveMqSourceParameters tunes an ActiveMQ broker
// source.
message AwsEventBridgePipeActiveMqSourceParameters {
  // The queue to read (1-1000 characters). FIXED FOR LIFE.
  string queue_name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1000
  }];

  // Secrets Manager secret ARN holding the broker's basic-auth
  // credentials - a reference, never the credential value itself.
  // REQUIRED by AWS for ActiveMQ.
  string basic_auth_credentials = 2 [
    (buf.validate.field).string.pattern = "^arn:aws.*:secretsmanager:.*$",
    (dev.planton.shared.options.sensitive_exempt_reason) = "a Secrets Manager secret ARN (a reference), never the credential value"
  ];

  // Events per batch (1-10000). Unset keeps AWS's default (100).
  optional int32 batch_size = 3 [(buf.validate.field).int32 = {
    gte: 1
    lte: 10000
