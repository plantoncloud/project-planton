# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: kubernetescloudnativepgoperator
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The operator stores no data of its own -- its state is the custom resources it reconciles, held in the cluster's etcd. Database data at rest is a property of the volumes the managed clusters provision, owned by KubernetesPostgres resources and the cluster's storage classes.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to key (see enc-at-rest); customer-managed keys for database volumes are configured on the target cluster's storage classes.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The operator's admission webhooks serve TLS to the API server (the webhook service name is baked into the webhook certificate -- the reason the release name is fixed).
      notes: TLS for client connections to the managed databases is owned by the KubernetesPostgres resources (CloudNativePG self-signs per-cluster certificates there); the operator-to-plugin gRPC TLS is owned by KubernetesCnpgBarmanCloudPlugin.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The modules render no external exposure -- the operator's only service is the in-cluster webhook endpoint consumed by the API server; the spec offers no ingress or LoadBalancer seam.
    - control_id: restricted-ingress
      status: not_applicable
      notes: The operator serves no client-facing traffic to restrict; its inbound caller is the Kubernetes API server (webhooks). Kubernetes NetworkPolicies (separate resources) can fence that path if required.
    - control_id: edge-protection
      status: not_applicable
      notes: A cluster-internal controller serves no HTTP edge traffic -- web application firewalls do not apply.
    - control_id: rbac
      status: configurable
      field_path: watch.cluster_wide
      evidence:
        type: spec_default
        reference: True (the chart default) grants the operator cluster-wide RBAC (ClusterRoles) to reconcile Cluster resources in every namespace; false fences it into watch.namespaces with namespace-scoped RBAC -- the spec's CEL rules force the fenced posture to name at least one namespace.
      notes: Access to the operator's own resources is governed by the target cluster's Kubernetes RBAC.
    - control_id: workload-identity
      status: not_applicable
      notes: The operator itself calls no cloud APIs. Object-store credentials or keyless workload identity for backups are declared per database on KubernetesPostgres resources (their backup and workload_identity fields), not here.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The operator exposes no authentication surface of its own -- no credentials, no user-facing endpoint. Its management plane is the Kubernetes API, governed by the cluster's RBAC.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: The operator's actions are Kubernetes API operations -- creating StatefulSets, Services, and Secrets for managed clusters -- captured by the target cluster's audit policy; the spec models no separate audit-log seam.
    - control_id: monitoring-integration
      status: configurable
      field_path: monitoring.pod_monitor_enabled
      evidence:
        type: spec_default
        reference: Unset ships no scrape wiring; true creates a PodMonitor for the operator's reconcile-loop metrics (requires the Prometheus operator CRDs on the cluster -- the release fails to install without them), and monitoring.grafana_dashboard ships the upstream dashboard as a sidecar-labeled ConfigMap.
      notes: Metrics for the managed databases themselves are served per cluster and owned by KubernetesPostgres resources.
    - control_id: backup-recovery
      status: not_applicable
      notes: The operator holds no data to back up; its own configuration is this manifest, re-appliable at any time. The backup ENGINE every KubernetesPostgres backup block depends on is KubernetesCnpgBarmanCloudPlugin, installed into this operator's namespace; what gets backed up, where, and on what schedule is declared on the KubernetesPostgres resources.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist at this layer; retention for database backups is declared per database on KubernetesPostgres resources (see backup-recovery).
    - control_id: multi-zone-ha
      status: configurable
      field_path: replicas
      evidence:
        type: spec_default
        reference: replicas defaults to 1; extra replicas are leader-elected warm standbys that shorten failover of the operator itself. Kubernetes spreads them across nodes subject to the cluster's scheduling.
      notes: An operator outage pauses reconciliation and failover automation only -- managed databases keep serving. The preset runs one replica.
    - control_id: deletion-protection
      status: not_applicable
      notes: "Neither Kubernetes nor the chart offers a deletion-protection flag on the release. The blast radius of deletion is deliberately bounded upstream: the chart stamps helm.sh/resource-policy: keep on every CRD unconditionally, so uninstalling never cascade-deletes the Cluster resources or the databases behind them."
    - control_id: managed-patching
      status: configurable
      field_path: chart_version
      evidence:
        type: spec_default
        reference: Unset installs the pinned default chart (0.29.0, which ships operator 1.30.0); upgrades are deliberate chart_version changes re-running the release with the new chart. The Barman Cloud plugin carries its own independent pin on its own kind.
      notes: Operator upgrades roll the managed databases' instance manager -- CloudNativePG's own documented rolling behavior, applied per cluster.
