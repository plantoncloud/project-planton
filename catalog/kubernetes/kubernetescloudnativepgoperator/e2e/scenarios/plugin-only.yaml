# The plugin-only posture: a CloudNativePG ALREADY runs on the cluster and
# this resource adds only the Barman Cloud plugin beside it — the shape of
# every cluster where the operator arrived by another hand (the Planton
# operator installs one for the platform's own database; Helm and GitOps
# installs are common) and arrived without backups. The resident operator is
# a scenario-local fixture of this same kind installed the ordinary way
# (operator, no plugin); the scenario JOINS its namespace (create_namespace
# false — the fixture owns cnpg-system) and manages the plugin release only.
# cert-manager is the plugin's TLS issuer, chained as a kind prerequisite.
# The verifier asserts the plugin Deployment Available and the ObjectStore
# CRD Established, and on destroy that the plugin is gone while the
# fixture's operator and its CRDs remain untouched.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesCloudNativePgOperator
metadata:
  name: e2e-cnpg-plugin-only
  annotations:
    planton.dev/e2e-prerequisites: "KubernetesCertManager, catalog/kubernetes/kubernetescloudnativepgoperator/e2e/fixture-resident-operator.yaml"
spec:
  namespace:
    value: cnpg-system
  install_operator: false
  barman_cloud_plugin:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
