# Install profile used when a consumer declares this operator as a registry
# prerequisite and ships no consumer-scoped override: the lean shape,
# owning cnpg-system. Backups are a sibling kind: a consumer scenario that
# declares a backup block chains KubernetesCnpgBarmanCloudPlugin, whose own
# install profile joins this namespace and brings cert-manager with it.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesCloudNativePgOperator
metadata:
  name: e2e-cnpg-fixture
spec:
  namespace:
    value: cnpg-system
  create_namespace: true
