# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/componentcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: ComponentCostProfile
metadata:
  name: kubernetescloudnativepgoperator
spec:
  billing_model: cluster_capacity
  cost_drivers:
    - field_path: replicas
      sku_meter: cluster CPU and memory reservations
      impact: Each operator replica carries the declared resources. Extra replicas are leader-elected warm standbys that shorten failover of the OPERATOR itself -- they add no reconciliation throughput, just standby capacity.
    - field_path: resources
      sku_meter: cluster CPU and memory reservations
      impact: The CPU and memory requests are what the scheduler reserves per operator replica. The chart ships no default requests or limits -- empty means the operator schedules unbounded.
  estimate_exclusions:
    - the price of reserved CPU and memory is the target cluster's node economics, which this catalog cannot know
    - "the PostgreSQL clusters this operator reconciles reserve their own capacity -- each rides its KubernetesPostgres resource, never this footprint"
    - the helm_values overlay merges last and can override the modeled values, including resources
    - "the Barman Cloud backup plugin is its own resource (KubernetesCnpgBarmanCloudPlugin) with its own footprint"
  notes: "This component installs the ENGINE, not the databases: its footprint is the operator pod(s). Everything the operator manages -- Cluster resources, their instances, volumes, and backups -- is declared through KubernetesPostgres resources, which carry their own capacity footprints."
