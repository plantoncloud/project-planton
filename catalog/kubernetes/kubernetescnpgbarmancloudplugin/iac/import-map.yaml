apiVersion: iac.planton.dev/v1
kind: ComponentImportMap
metadata:
  name: kubernetescnpgbarmancloudplugin
spec:
  # The plugin installs as ONE Helm release ("plugin-barman-cloud") in the
  # operator's namespace, plus the optional anchor namespace (rare: the
  # namespace is normally the operator's and pre-exists). The cert-manager
  # Issuer and Certificates the chart renders travel inside the release --
  # they are not separate Terraform resources and need no recipes.
  values:
    - name: release_name
      derivations:
        - from_stack_output: release_name
      where_to_find: >-
        Always "plugin-barman-cloud" -- the module fixes the release name
        (the chart bakes the plugin's Service, Secret and ConfigMap names,
        and the kept ObjectStore CRD is adopted only by a release of the
        same name and namespace). Confirm with `helm list -n <namespace>`
        (NAME column).
    - name: release_namespace
      derivations:
        - from_stack_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The CloudNativePG operator's namespace -- `helm list -A` (NAMESPACE
        column); conventionally "cnpg-system".
    - name: namespace_name
      derivations:
        - from_stack_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the installation
        namespace itself.
