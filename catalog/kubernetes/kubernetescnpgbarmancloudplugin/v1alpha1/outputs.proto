syntax = "proto3";

package dev.planton.kubernetes.kubernetescnpgbarmancloudplugin.v1alpha1;

/**
 * **KubernetesCnpgBarmanCloudPluginStackOutputs** -- the composition handles
 * a deployed Barman Cloud plugin exports. The plugin has no per-database
 * surface of its own: KubernetesPostgres backup blocks name the plugin
 * inside their Cluster and point at ObjectStore resources they render
 * themselves, so the handles here identify the installation.
 */
message KubernetesCnpgBarmanCloudPluginStackOutputs {
  // Namespace the plugin runs in -- the CloudNativePG operator's namespace,
  // by requirement.
  string namespace = 1;

  // Helm release name of the plugin (fixed: "plugin-barman-cloud" -- one
  // plugin per operator namespace).
  string release_name = 2;

  // The CNPG-I plugin identifier a Cluster names in its `plugins` list
  // (fixed: "barman-cloud.cloudnative-pg.io"). KubernetesPostgres renders
  // it whenever a backup block or an object-store recovery is declared.
  string plugin_name = 3;
}
