# The baseline install and the chart upgrade: the operator alone, pinned to
# the previous published chart, then moved to the current one in place
# (minimal.to.yaml, the second act). Installing the operator alone deploys
# NO platform (the verifier asserts exactly that); platforms are declared
# separately with KubernetesPlantonPlatform resources. The chart owns its
# definitions: the upgrade rolls the manager to the new image and leaves the
# definitions where they are (the verifier proves they predate the manager
# that serves them), and destroy keeps them by default (the verifier asserts
# they survive), so the reinstall lane adopts them.
#
# EVERY scenario of this kind installs into namespace "planton-operator":
# the release name is fixed (one operator per cluster), and Helm binds kept
# definitions to that release identity, so a lane in another namespace
# would be refused by the definitions an earlier lane kept.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesPlantonOperator
metadata:
  name: e2e-planton-operator-minimal
  annotations:
    planton.dev/e2e-upgrade-manifest: minimal.to.yaml
    planton.dev/e2e-reinstall: "true"
spec:
  namespace:
    value: planton-operator
  create_namespace: true
  # The previous published chart, pinned explicitly: the first act must not
  # follow the default, or the second act would have nothing to move to.
  chart_version: 0.9.1
