syntax = "proto3";

package dev.planton.kubernetes.kuberneteshttproute.v1alpha1;

// KubernetesHttpRouteStackOutputs captures observable outputs after the
// HTTPRoute is created on the target cluster. Controller-managed status (the
// per-parent Accepted/ResolvedRefs conditions) is reconciled asynchronously by
// the Gateway implementation and read via kubectl, so it is intentionally not
// stored here.
message KubernetesHttpRouteStackOutputs {
  // Name of the created HTTPRoute (equals metadata.name). In InfraCharts this
  // orders the route after the Gateway and backends it references.
  string route_name = 1;

  // Namespace the HTTPRoute was created in (the resolved spec.namespace).
  // Cross-namespace parent and backend references from this route are subject
  // to ReferenceGrant rules relative to this value.
  string namespace = 2;

  // The first hostname the route matches (spec.hostnames[0]) -- the address a
  // request reaches this route at, exported exactly as the Ingress kind exports
  // its first rule's host, so anything that reads a hostname off an Ingress
  // (a dashboard, a smoke test, a DNS record, a deployment's URL discovery)
  // reads it off a route the same way. Empty when the route declares no
  // hostnames and matches every host its Gateway listener accepts.
  string first_host = 3;
}
