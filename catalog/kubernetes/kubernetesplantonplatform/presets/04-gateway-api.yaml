apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesPlantonPlatform
metadata:
  name: planton
spec:
  namespace:
    value: planton
  create_namespace: true
  version: v0.0.50
  ingress:
    enabled: true
    # One hostname serves console AND API. The identity server bakes this
    # URL into its realm at first boot — set it before the first sign-in.
    hostname: planton.example.com
    # The Gateway API Gateway the cluster already runs (Istio, Envoy
    # Gateway, Cilium, a cloud Gateway). Planton never edits it: it
    # attaches one route for the hostname and reads the listeners. Pinning
    # section_name to the HTTPS listener that already serves the hostname
    # means the platform advertises https:// with no tls block at all.
    #
    # name and namespace are foreign keys to KubernetesGateway. `value:`
    # names a Gateway created outside Planton (shown here). When the
    # Gateway is itself a Planton resource in the same infra chart, wire
    # both with `valueFrom` and the platform deploys after it and follows
    # a rename (kind and fieldPath come from the field's defaults):
    #   name:
    #     valueFrom:
    #       kind: KubernetesGateway
    #       name: <gateway-resource-name>
    #   namespace:
    #     valueFrom:
    #       kind: KubernetesGateway
    #       name: <gateway-resource-name>
    gateway_ref:
      name:
        value: main
      namespace:
        value: istio-ingress
      section_name: https
    # reachability is left at its default (auto): the HTTPS listener makes
    # the door public in the platform's eyes, which is what keyless cloud
    # connections and GitHub webhook delivery need. A Gateway only your
    # network reaches (split DNS, an internal load balancer) says so with
    # `reachability: private`. Requires operator chart 0.11.0 or newer.
