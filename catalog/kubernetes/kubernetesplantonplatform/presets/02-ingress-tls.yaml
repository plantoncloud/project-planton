apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesPlantonPlatform
metadata:
  name: planton
spec:
  namespace:
    value: planton
  create_namespace: true
  version: v0.0.50
  ingress:
    enabled: true
    # One hostname serves console AND API. The identity server bakes this
    # URL into its realm at first boot — set it before the first sign-in.
    hostname: planton.example.com
    tls:
      # cert-manager issues and renews the certificate. Bring your own
      # instead by replacing `issuer` with `secret_name`.
      issuer:
        name: letsencrypt
        kind: ClusterIssuer
    # reachability is left at its default (auto): a hostname served over
    # HTTPS is treated as reachable from the public internet, which is what
    # keyless cloud connections and GitHub webhook delivery need. If only
    # your network reaches this address (split DNS, a corporate CA), say so
    # with `reachability: private` and those doors stay honestly closed.
    # Requires operator chart 0.11.0 or newer.
