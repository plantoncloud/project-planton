apiVersion: iac.planton.dev/v1
kind: ComponentImportMap
metadata:
  name: kubernetesmongodb
spec:
  # The module renders one kubectl_manifest (the PerconaServerMongoDB CR)
  # plus for_each-keyed credential Secrets and the optional anchor
  # namespace. Every satellite name is deterministic (derived from
  # metadata.name), so the whole family imports blind.
  values:
    # ── the PerconaServerMongoDB CR ────────────────────────────────────
    - name: api_version
      tofu_resource_name: mongodb
      derivations:
        - literal: psmdb.percona.com/v1
      where_to_find: Always "psmdb.percona.com/v1" — the CR's group/version.
    - name: kind
      tofu_resource_name: mongodb
      derivations:
        - literal: PerconaServerMongoDB
      where_to_find: Always "PerconaServerMongoDB" — the CR kind this module applies.
    - name: name
      tofu_resource_name: mongodb
      derivations:
        - from_metadata_name: true
        - from_stack_output: cluster_name
      where_to_find: >-
        The CR's metadata.name (equals the Planton resource name) —
        `kubectl get psmdb -A` (NAME column).
    # ── the PerconaServerMongoDBRestore run (when spec.restore is declared) ─
    # Its name hashes the declaration, so it rides in as a stack output
    # rather than a derivation the recipe could recompute.
    - name: api_version
      tofu_resource_name: restore
      derivations:
        - literal: psmdb.percona.com/v1
      where_to_find: Always "psmdb.percona.com/v1" — the Restore CR's group/version.
    - name: kind
      tofu_resource_name: restore
      derivations:
        - literal: PerconaServerMongoDBRestore
      where_to_find: Always "PerconaServerMongoDBRestore" — the run the module renders for spec.restore.
    - name: name
      tofu_resource_name: restore
      derivations:
        - from_stack_output: restore_name
      where_to_find: >-
        The Restore object's metadata.name (`<name>-restore-<8 hex>`) —
        the `restore_name` output, or `kubectl get psmdb-restore -n <namespace>`.
    # ── shared namespace segment for every namespaced object ───────────
    - name: namespace
      derivations:
        - from_stack_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The cluster's namespace — `kubectl get psmdb -A` (NAMESPACE column).
    # ── declared-credential Secrets ────────────────────────────────────
    # Both for_each families are keyed by the FULL Secret name, so the
    # unscoped from_address_key fallback derives them.
    - name: secret_name
      derivations:
        - from_address_key: true
      where_to_find: >-
        The module keys each Secret's address by the deterministic name
        it renders ("<name>-user-<username>", "<name>-backup-<storage>") —
        `kubectl get secrets -n <namespace>`.
    - name: secret_namespace
      derivations:
        - from_stack_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Same namespace as the cluster — every satellite the module renders
        is namespaced with it.
    # ── the optional anchor namespace ───────────────────────────────────
    - name: namespace_name
      derivations:
        - from_stack_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the cluster's
        namespace itself.
