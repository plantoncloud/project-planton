apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesMongodb
metadata:
  name: prod-mongo
spec:
  namespace:
    value: percona-mongo
  replica_sets:
    - name: rs0
      # The production shape: a majority survives one member loss; on GKE
      # the operator's default anti-affinity (one member per node) makes
      # the autoscaler add nodes to honor it.
      size: 3
      storage:
        size: 100Gi
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 4Gi
      pod_disruption_budget:
        max_unavailable: 1
  tls:
    mode: requireTLS
  users:
    - name: app
      roles:
        - name: readWrite
          db: app
  backup:
    storages:
      - name: r2
        main: true
        # Cloudflare R2, declared in R2's own terms: the bucket, its account
        # and jurisdiction, and a Cloudflare API token — every one a reference
        # onto the catalog's Cloudflare kinds. The module composes the S3
        # endpoint the bucket's jurisdiction requires, region `auto`, and
        # path-style addressing; nothing S3-shaped is typed here.
        r2:
          bucket:
            valueFrom:
              kind: CloudflareR2Bucket
              name: prod-mongo-archive
              fieldPath: status.outputs.bucket_name
          # One prefix per cluster: a restore target declares this same
          # storage and reads the backups from here.
          prefix: prod-mongo
          account_id:
            valueFrom:
              kind: CloudflareR2Bucket
              name: prod-mongo-archive
              fieldPath: status.outputs.account_id
          jurisdiction:
            valueFrom:
              kind: CloudflareR2Bucket
              name: prod-mongo-archive
              fieldPath: status.outputs.jurisdiction
          # The credential is a CloudflareAccountApiToken carrying `Workers R2
          # Storage Bucket Item Write` on this bucket; the token kind exports
          # itself as the S3 key pair R2 authenticates. No key is typed here.
          credentials:
            access_key_id:
              valueFrom:
                kind: CloudflareAccountApiToken
                name: prod-mongo-archive-writer
                fieldPath: status.outputs.r2_access_key_id
            secret_access_key:
              valueFrom:
                kind: CloudflareAccountApiToken
                name: prod-mongo-archive-writer
                fieldPath: status.outputs.r2_secret_access_key
    tasks:
      - name: nightly
        schedule: "0 2 * * *" # FIVE-field cron — 02:00 nightly
        storage_name: r2
        type: logical
        keep: 14
    pitr:
      # Continuous oplog archiving between backups: a restore lands at any
      # moment, not just at the last nightly.
      enabled: true
