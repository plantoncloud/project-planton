# The batch's backup bucket — one bucket, one prefix per database, both
# backup identities granted TWO roles through the bucket's own additive IAM
# (the member handles flow in by reference, so the grant IS the ordering
# edge: the bucket binds after the accounts exist):
#
#   - roles/storage.objectAdmin       read/write/delete the backup objects
#   - roles/storage.legacyBucketReader storage.buckets.get + objects.list —
#     Barman Cloud verifies the archive destination with a bucket-level GET
#     before every WAL archive, and objectAdmin alone does not carry it
#     (live-caught: ContinuousArchivingFailing, "does not have
#     storage.buckets.get access"). PBM's Google client reads bucket
#     attributes the same way.
#
# Versioning off and force_destroy on: a lane's backups are disposable
# evidence, and the teardown must be able to delete a non-empty bucket.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGcsBucket
metadata:
  name: planton-e2e-gke-backups
spec:
  projectId:
    value: ${GCP_PROJECT_ID}
  # Bucket names are a global namespace: the project id makes this one
  # collision-free without a random suffix the lanes would have to discover.
  bucketName: planton-e2e-gke-backups-${GCP_PROJECT_ID}
  location: ${GCP_REGION}
  uniformBucketLevelAccessEnabled: true
  publicAccessPrevention: enforced
  forceDestroy: true
  iamMembers:
    - role: roles/storage.objectAdmin
      member:
        valueFrom:
          kind: GcpServiceAccount
          name: planton-e2e-gke-pg-backup
          fieldPath: status.outputs.member
    - role: roles/storage.objectAdmin
      member:
        valueFrom:
          kind: GcpServiceAccount
          name: planton-e2e-gke-mongo-backup
          fieldPath: status.outputs.member
    - role: roles/storage.legacyBucketReader
      member:
        valueFrom:
          kind: GcpServiceAccount
          name: planton-e2e-gke-pg-backup
          fieldPath: status.outputs.member
    - role: roles/storage.legacyBucketReader
      member:
        valueFrom:
          kind: GcpServiceAccount
          name: planton-e2e-gke-mongo-backup
          fieldPath: status.outputs.member
