# The backup proof: WAL archiving plus an immediate base backup into the
# in-cluster MinIO fixture, through the Barman Cloud plugin — the full
# plugin-era backup chain (ObjectStore + Cluster plugin wiring +
# ScheduledBackup) proven live with no cloud account. The plugin is
# declared here as a kind prerequisite (its own chain brings cert-manager
# and the operator; a backup block without the plugin parks the Cluster in
# the operator's unknown-plugin phase). The verifier (switched on by this
# scenario's name) waits for the immediate schedule's Backup to reach
# Completed. Declared credentials (owner password, a managed role, the
# superuser, MinIO keys) exercise every secret-materialization path.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesPostgres
metadata:
  name: e2e-pg-backup
  annotations:
    planton.dev/e2e-prerequisites: "KubernetesCnpgBarmanCloudPlugin, catalog/kubernetes/kubernetespostgres/e2e/fixture-minio.yaml"
spec:
  namespace:
    value: e2e-pg-backup
  create_namespace: true
  instances: 1
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: appdb
      owner: appuser
      owner_password: e2e-owner-password
      data_checksums: true
  superuser:
    enabled: true
    password: e2e-superuser-password
  roles:
    - name: analyst
      comment: read-side reporting role
      login: true
      password: e2e-analyst-password
      connection_limit: 10
  backup:
    object_store:
      destination_path: s3://pg-backups/e2e-pg-backup
      s3:
        region: minio
        endpoint_url: http://minio.e2e-postgres-minio.svc.cluster.local:9000
        access_keys:
          access_key_id: minioadmin
          secret_access_key: minioadmin
      wal:
        compression: gzip
      data:
        compression: gzip
        jobs: 1
    retention_policy: 7d
    schedules:
      - name: initial
        schedule: "0 0 3 * * *"
        immediate: true
