apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesPostgres
metadata:
  name: app-db
spec:
  namespace:
    value: app-db
  create_namespace: true
  instances: 3
  storage:
    size: 50Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  bootstrap:
    initdb:
      database: app
      data_checksums: true
  backup:
    object_store:
      # s3:// scheme also for S3-compatible stores — one path per cluster.
      destination_path: s3://pg-backups/app-db
      s3:
        # S3-compatible stores use the store's expected region value —
        # MinIO accepts any.
        region: minio
        # The S3-COMPATIBLE arm: endpoint URL of the store (in-cluster
        # MinIO here). Cloudflare R2 has its own arm (`r2`) that composes
        # the endpoint from the bucket's account and jurisdiction.
        endpoint_url: http://minio.minio-system.svc:9000
        # An S3-compatible endpoint authenticates with access keys — the
        # keyless posture only mints AWS credentials (spec-enforced). The
        # keys land in the `app-db-backup-creds` Secret, never inline in
        # the rendered resources.
        access_keys:
          access_key_id: <store-access-key>
          secret_access_key: <store-secret-key>
        # For self-signed endpoint TLS, add the PEM CA bundle:
        # endpoint_ca_pem: |
        #   -----BEGIN CERTIFICATE-----
        #   ...
      wal:
        compression: zstd
      data:
        compression: gzip
    retention_policy: 30d
    schedules:
      - name: daily
        schedule: "0 0 2 * * *" # six-field cron, seconds first
        immediate: true
