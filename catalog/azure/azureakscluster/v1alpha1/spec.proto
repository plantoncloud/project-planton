// Application Gateway Ingress Controller add-on. Anchor it with exactly
// one of: an existing gateway (gateway_id), a new gateway in a new subnet
// (subnet_cidr), or a new gateway in an existing subnet (subnet_id).
message AzureAksClusterIngressApplicationGateway {
  // Existing Application Gateway AGIC programs. The gateway must be
  // reachable from the cluster network (peered or same VNet).
  dev.planton.shared.foreignkey.v1.StringValueOrRef gateway_id = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureApplicationGateway,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.application_gateway_id"
  ];

  // Name for the AKS-created gateway (with subnet_cidr/subnet_id
  // anchors). Unset lets AKS derive one.
  string gateway_name = 2;

  // CIDR for a NEW subnet AKS creates in the cluster VNet to host a new
  // gateway, e.g. "10.225.0.0/24" (at least /27).
  string subnet_cidr = 3;

  // Existing subnet to host the new gateway -- must be dedicated to it
  // and at least /27. The add-on's GATEWAY lives in this subnet; the
  // cluster does not, so the reference is access, not placement, on a
  // diagram -- the cluster's own node subnet places it.
  dev.planton.shared.foreignkey.v1.StringValueOrRef subnet_id = 4 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureSubnet,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.subnet_id"
  ];

  option (buf.validate.message).cel = {
    id: "aks_agic_exactly_one_anchor"
    message: "Set exactly one of gateway_id, subnet_cidr, or subnet_id to anchor the Application Gateway"
    expression: "(has(this.gateway_id) ? 1 : 0) + (this.subnet_cidr != '' ? 1 : 0) + (has(this.subnet_id) ? 1 : 0) == 1"
  };
}

