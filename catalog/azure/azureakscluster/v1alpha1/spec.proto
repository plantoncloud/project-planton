// Kubelet CPU manager policy.
enum AzureAksClusterCpuManagerPolicy {
  // Not specified: kubelet default ("none") -- shared CPU pool.
  azure_aks_cluster_cpu_manager_policy_unspecified = 0;

  // Shared CPU pool for all pods.
