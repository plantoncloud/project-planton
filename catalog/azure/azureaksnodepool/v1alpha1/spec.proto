// Node-level network hardening for the pool.
message AzureAksNodePoolNodeNetworkProfile {
  // Host port ranges pods may bind on the node -- each entry opens a
  // port range/protocol in the node's network security rules.
  repeated AzureAksNodePoolAllowedHostPorts allowed_host_ports = 1;

  // ARM ids of Application Security Groups the pool's nodes join, so NSG
  // rules can target "this pool's nodes" as a group. Plain ARM ids.
  repeated string application_security_group_ids = 2;

  // Azure tags applied to the node PUBLIC IPs (with
  // node_public_ip_enabled), e.g. routing preference tags. Set at pool
  // creation.
  map<string, string> node_public_ip_tags = 3;
}

// A host port range pods may use on nodes.
message AzureAksNodePoolAllowedHostPorts {
  // Start of the port range (1-65535).
  int32 port_start = 1 [(buf.validate.field).cel = {
    id: "aks_np_host_port_start_range"
    message: "port_start must be between 1 and 65535"
    expression: "this == 0 || (this >= 1 && this <= 65535)"
  }];

  // End of the port range (1-65535, >= port_start).
  int32 port_end = 2 [(buf.validate.field).cel = {
    id: "aks_np_host_port_end_range"
    message: "port_end must be between 1 and 65535"
    expression: "this == 0 || (this >= 1 && this <= 65535)"
  }];

  // Protocol for the range.
  AzureAksNodePoolHostPortProtocol protocol = 3;
}

// Protocol for an allowed host-port range.
enum AzureAksNodePoolHostPortProtocol {
  // Not specified.
  azure_aks_node_pool_host_port_protocol_unspecified = 0;

  // TCP.
  TCP = 1;

  // UDP.
  UDP = 2;
}

// Windows-pool networking.
message AzureAksNodePoolWindowsProfile {
  // Whether Windows nodes get outbound NAT provided by the cluster.
  // Azure's default is true; disable only when routing Windows egress
  // through your own NAT arrangement. Fixed at creation.
  optional bool outbound_nat_enabled = 1 [(dev.planton.shared.options.default) = "true"];
}
