syntax = "proto3";

package dev.planton.azure.azuredatafactoryintegrationruntime.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// **AzureDataFactoryIntegrationRuntimeSpec** defines an Azure Data
// Factory integration runtime -- the compute engine a factory's
// pipelines, data flows, and copy activities actually run on. The
// factory itself stores definitions; an integration runtime is what
// executes them.
//
// The engine flavor is declared by which variant block is present:
// set exactly ONE of the three blocks below. All flavors share one
// factory-scoped name namespace
// ({factory_id}/integrationRuntimes/{name}).
//
//   - `azure`: the fully managed compute for mapping data flows --
//     serverless Spark that Azure provisions on demand and tears down
//     after the configured time-to-live.
//   - `azure_ssis`: a managed cluster of VMs that runs SQL Server
//     Integration Services (SSIS) packages -- the lift-and-shift home
//     for existing SSIS projects, with an optional SSISDB catalog,
//     custom setup, and virtual network injection.
//   - `self_hosted`: a registration for the agent you install on your
//     own machines (on-premises or in any network Azure cannot reach
//     directly). Azure issues authorization keys the agent uses to
//     join; creating the registration is free -- the compute is
//     yours.
//
// Billing reality: the azure flavor bills only while data flows run
// (plus any warm time-to-live); the SSIS flavor bills per node-hour
// from the moment the runtime is STARTED (creating it leaves it
// stopped and unbilled); the self-hosted flavor is free on Azure's
// side.
message AzureDataFactoryIntegrationRuntimeSpec {
  // The Data Factory the integration runtime lives in, by ARM ID.
  // Can be a literal string or a reference to an AzureDataFactory
  // output.
  //
  // **ForceNew**: changing this destroys and recreates the runtime.
  dev.planton.shared.foreignkey.v1.StringValueOrRef data_factory_id = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureDataFactory,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.data_factory_id"
  ];

  // The integration runtime's name -- unique within the factory
  // across all three flavors. Letters, numbers, and dashes; must
  // start and end with a letter or number; no consecutive dashes.
  // The managed flavors (azure, azure_ssis) additionally require at
  // least 3 characters -- the two format rules are enforced by the
  // message rules below, each transcribed from Azure's own validator
  // for that flavor.
  //
  // **ForceNew**: changing this destroys and recreates the runtime.
  string name = 2 [(buf.validate.field).required = true];

  // A human-readable description of what the runtime is for.
  string description = 3;

  // The managed data-flow compute engine. Set exactly one variant
  // block on this spec.
  AzureDataFactoryIntegrationRuntimeAzure azure = 4;

  // The managed SSIS package runtime. Set exactly one variant block
  // on this spec.
  AzureDataFactoryIntegrationRuntimeAzureSsis azure_ssis = 5;

  // The self-hosted agent registration. Set exactly one variant
  // block on this spec.
  AzureDataFactoryIntegrationRuntimeSelfHosted self_hosted = 6;

  option (buf.validate.message).cel = {
    id: "azure_data_factory_integration_runtime_exactly_one_variant"
    message: "Set exactly one integration runtime variant block -- the variant determines the engine flavor"
    expression: "(has(this.azure) ? 1 : 0) + (has(this.azure_ssis) ? 1 : 0) + (has(this.self_hosted) ? 1 : 0) == 1"
  };

  // Azure's own name rule for the two MANAGED flavors (a slightly
  // stricter pattern than the self-hosted one: minimum 3
  // characters).
  option (buf.validate.message).cel = {
    id: "azure_data_factory_integration_runtime_name_format_managed"
    message: "Managed runtime names need at least 3 characters -- letters, numbers, and dashes only, starting and ending with a letter or number, no consecutive dashes"
    expression: "!(has(this.azure) || has(this.azure_ssis)) || this.name.matches('^([a-zA-Z0-9](-|-?[a-zA-Z0-9]+)+[a-zA-Z0-9])$')"
  };

  // Azure's own name rule for the SELF-HOSTED flavor.
  option (buf.validate.message).cel = {
    id: "azure_data_factory_integration_runtime_name_format_self_hosted"
    message: "Self-hosted runtime names use letters, numbers, and dashes, starting and ending with a letter or number, with no consecutive dashes"
    expression: "!has(this.self_hosted) || this.name.matches('^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$')"
  };
}

// The fully managed compute for mapping data flows: serverless Spark
// clusters Azure provisions when a data flow runs and tears down
// afterward. Creating the runtime is free -- billing happens per
// vCore-hour while a cluster is up (runs plus any warm
// time_to_live_min).
message AzureDataFactoryIntegrationRuntimeAzure {
  // The Azure region the compute is provisioned in, e.g. "eastus" --
  // or the literal "AutoResolve" to run each data flow in the region
  // closest to its data (the Data Factory Studio default).
  //
  // **ForceNew**: changing this destroys and recreates the runtime.
  string region = 1 [(buf.validate.field).required = true];

  // Whether the cluster is torn down immediately after every data
  // flow run. Unspecified applies true (Azure's default). Set false
  // together with time_to_live_min to keep a warm pool between runs.
  optional bool cleanup_enabled = 2 [(dev.planton.shared.options.default) = "true"];

  // The compute profile of the Spark cluster -- omit for "General".
  string compute_type = 3 [(buf.validate.field).string = {
    in: [
      "",
      "General",
      "ComputeOptimized",
      "MemoryOptimized"
    ]
  }];

  // The cluster's core count -- omit for 8 (Azure's smallest data
  // flow cluster).
  int32 core_count = 4 [(buf.validate.field).cel = {
    id: "integration_runtime_azure_core_count"
    message: "core_count must be one of 8, 16, 32, 48, 80, 144, or 272"
    expression: "this == 0 || this in [8, 16, 32, 48, 80, 144, 272]"
  }];

  // Minutes a cluster stays warm after a data flow run before the
  // cleanup -- omit for 0 (tear down immediately). Warm minutes bill
  // like run minutes.
  int32 time_to_live_min = 5 [(buf.validate.field).int32.gte = 0];

  // Minutes an interactive authoring (debug) session stays alive
  // before auto-terminating -- one of 10, 30, 60, or 120; omit to
  // leave interactive authoring disabled. Requires
  // virtual_network_enabled (Azure's own rule). Azure applies this
  // through a separate enable-interactive-authoring operation after
  // the runtime is online, and a live debug session bills while
  // enabled -- both engines handle the extra call.
  int32 interactive_authoring_time_to_live_in_minutes = 6 [(buf.validate.field).cel = {
    id: "integration_runtime_azure_interactive_ttl"
    message: "interactive_authoring_time_to_live_in_minutes must be one of 10, 30, 60, or 120"
    expression: "this == 0 || this in [10, 30, 60, 120]"
  }];

  // Whether the compute joins the factory's managed virtual network
  // (so data flows can reach private endpoints). The factory must
  // have its managed virtual network enabled, or the deploy fails
  // with Azure's own error.
  //
  // **ForceNew**: changing this destroys and recreates the runtime.
  bool virtual_network_enabled = 7;

  // Azure rejects interactive authoring outside the managed virtual
  // network (transcribed from the provider's own cross-field check).
  option (buf.validate.message).cel = {
    id: "integration_runtime_azure_interactive_requires_vnet"
    message: "interactive_authoring_time_to_live_in_minutes requires virtual_network_enabled to be true"
    expression: "this.interactive_authoring_time_to_live_in_minutes == 0 || this.virtual_network_enabled"
  };
}

// The managed SSIS package runtime: a cluster of Azure-managed VMs
// that runs SQL Server Integration Services packages. Creating the
// runtime leaves it STOPPED and unbilled; node-hours bill only while
// it is started (start/stop is an operational action in Data Factory
// Studio or via the Data Factory API, not part of this definition).
message AzureDataFactoryIntegrationRuntimeAzureSsis {
  // The Azure region the SSIS nodes run in, e.g. "eastus".
  //
  // **ForceNew**: changing this destroys and recreates the runtime.
  string region = 1 [(buf.validate.field).required = true];

  // The VM size of each node (Azure's fixed menu for SSIS runtimes).
  string node_size = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: [
        "Standard_D2_v3",
        "Standard_D4_v3",
        "Standard_D8_v3",
        "Standard_D16_v3",
        "Standard_D32_v3",
        "Standard_D64_v3",
        "Standard_E2_v3",
        "Standard_E4_v3",
        "Standard_E8_v3",
        "Standard_E16_v3",
        "Standard_E32_v3",
        "Standard_E64_v3",
        "Standard_D1_v2",
        "Standard_D2_v2",
        "Standard_D3_v2",
        "Standard_D4_v2",
        "Standard_A4_v2",
        "Standard_A8_v2"
      ]
    }
  ];

  // How many nodes the cluster runs (1-10) -- omit for 1.
  int32 number_of_nodes = 3 [(buf.validate.field).cel = {
    id: "integration_runtime_ssis_number_of_nodes"
    message: "number_of_nodes must be between 1 and 10"
    expression: "this == 0 || (this >= 1 && this <= 10)"
  }];

  // How many packages one node executes in parallel (1-16) -- omit
  // for 1.
  int32 max_parallel_executions_per_node = 4 [(buf.validate.field).cel = {
    id: "integration_runtime_ssis_max_parallel"
    message: "max_parallel_executions_per_node must be between 1 and 16"
    expression: "this == 0 || (this >= 1 && this <= 16)"
  }];

  // The SSIS edition of the nodes -- omit for "Standard".
  // "Enterprise" unlocks the Enterprise-only SSIS features.
  string edition = 5 [(buf.validate.field).string = {
    in: [
      "",
      "Standard",
      "Enterprise"
    ]
  }];

  // How the SQL Server licenses on the nodes are paid for -- omit
  // for "LicenseIncluded". "BasePrice" applies Azure Hybrid Benefit
  // (bring your own license).
  string license_type = 6 [(buf.validate.field).string = {
    in: [
      "",
      "LicenseIncluded",
      "BasePrice"
    ]
  }];

  // The name of a factory credential (a user-assigned managed
  // identity registered on the AzureDataFactory itself, under its
  // `credentials`) the runtime authenticates with -- e.g. toward the
  // SSISDB catalog server. Omit to use the factory's system identity.
  string credential_name = 7;

  // Hosts the SSISDB catalog (the project/package store SSIS Studio
  // deploys to) on an Azure SQL server. Omit to run packages without
  // a catalog (files/package stores only).
  AzureDataFactoryIntegrationRuntimeSsisCatalogInfo catalog_info = 8;

  // A custom setup script container: a blob container holding
  // main.cmd plus installers, executed on every node at start. The
  // slower, fully general alternative to express_custom_setup.
  AzureDataFactoryIntegrationRuntimeSsisCustomSetupScript custom_setup_script = 9;

  // Express custom setup: environment variables, a PowerShell
  // version, licensed components, and Windows credential-manager
  // entries applied to every node at start -- without a setup script
  // container.
  AzureDataFactoryIntegrationRuntimeSsisExpressCustomSetup express_custom_setup = 10;

  // Express virtual network injection: the runtime reaches the
  // subnet through Azure's injection without you delegating the
  // subnet to Data Factory. The lighter alternative to
  // vnet_integration (standard injection).
  AzureDataFactoryIntegrationRuntimeSsisExpressVnetIntegration express_vnet_integration = 11;

  // Standard virtual network injection: the nodes join a subnet you
  // own (address the network by ID + subnet name, or the subnet by
  // ID directly).
  AzureDataFactoryIntegrationRuntimeSsisVnetIntegration vnet_integration = 12;

  // Package stores: named file/MSDB locations (each reached through
  // a linked service) that SSIS Studio can deploy packages to,
  // instead of -- or alongside -- the SSISDB catalog.
  repeated AzureDataFactoryIntegrationRuntimeSsisPackageStore package_store = 13;

  // Scales the copy activities that run ON this runtime -- data
  // integration units and their warm time-to-live.
  AzureDataFactoryIntegrationRuntimeSsisCopyComputeScale copy_compute_scale = 14;

  // Scales the pipeline/external activities that run ON this runtime
  // -- node counts and their warm time-to-live.
  AzureDataFactoryIntegrationRuntimeSsisPipelineExternalComputeScale pipeline_external_compute_scale = 15;

  // Routes the runtime's on-premises data access through a
  // self-hosted integration runtime (the proxy), staging data
  // through a storage linked service.
  AzureDataFactoryIntegrationRuntimeSsisProxy proxy = 16;
}

// The SSISDB catalog host: an Azure SQL server that stores deployed
// SSIS projects and packages. Azure creates the SSISDB database on
// this server when the runtime starts.
message AzureDataFactoryIntegrationRuntimeSsisCatalogInfo {
  // The Azure SQL server's endpoint, e.g.
  // myserver.database.windows.net.
  string server_endpoint = 1 [(buf.validate.field).required = true];

  // The server's SQL administrator login -- omit to authenticate as
  // the factory's managed identity (grant it access on the server).
  string administrator_login = 2;

  // The administrator's password. Stored by Azure as a hidden secure
  // string. SECRET. Omit when authenticating with the managed
  // identity.
  string administrator_password = 3 [(dev.planton.shared.options.sensitive) = true];

  // The service tier of the SSISDB database Azure creates
  // (DTU or vCore SKU name) -- omit for Azure's default. Mutually
  // exclusive with elastic_pool_name.
  string pricing_tier = 4 [(buf.validate.field).string = {
    in: [
      "",
      "Basic",
      "S0",
      "S1",
      "S2",
      "S3",
      "S4",
      "S6",
      "S7",
      "S9",
      "S12",
      "P1",
      "P2",
      "P4",
      "P6",
      "P11",
      "P15",
      "GP_S_Gen5_1",
      "GP_S_Gen5_2",
      "GP_S_Gen5_4",
      "GP_S_Gen5_6",
      "GP_S_Gen5_8",
      "GP_S_Gen5_10",
      "GP_S_Gen5_12",
      "GP_S_Gen5_14",
      "GP_S_Gen5_16",
      "GP_S_Gen5_18",
      "GP_S_Gen5_20",
      "GP_S_Gen5_24",
      "GP_S_Gen5_32",
      "GP_S_Gen5_40",
      "GP_Gen5_2",
      "GP_Gen5_4",
      "GP_Gen5_6",
      "GP_Gen5_8",
      "GP_Gen5_10",
      "GP_Gen5_12",
      "GP_Gen5_14",
      "GP_Gen5_16",
      "GP_Gen5_18",
      "GP_Gen5_20",
      "GP_Gen5_24",
      "GP_Gen5_32",
      "GP_Gen5_40",
      "GP_Gen5_80",
      "BC_Gen5_2",
      "BC_Gen5_4",
      "BC_Gen5_6",
      "BC_Gen5_8",
      "BC_Gen5_10",
      "BC_Gen5_12",
      "BC_Gen5_14",
      "BC_Gen5_16",
      "BC_Gen5_18",
      "BC_Gen5_20",
      "BC_Gen5_24",
      "BC_Gen5_32",
      "BC_Gen5_40",
      "BC_Gen5_80",
      "HS_Gen5_2",
      "HS_Gen5_4",
      "HS_Gen5_6",
      "HS_Gen5_8",
      "HS_Gen5_10",
      "HS_Gen5_12",
      "HS_Gen5_14",
      "HS_Gen5_16",
      "HS_Gen5_18",
      "HS_Gen5_20",
      "HS_Gen5_24",
      "HS_Gen5_32",
      "HS_Gen5_40",
      "HS_Gen5_80"
    ]
  }];

  // The elastic pool on the server to create SSISDB in -- the
  // alternative to picking a pricing_tier. Mutually exclusive with
  // pricing_tier.
  string elastic_pool_name = 5;

  // The name of the dual-standby pair for SSISDB geo-failover -- set
  // when the catalog participates in a failover group.
  string dual_standby_pair_name = 6;

  option (buf.validate.message).cel = {
    id: "integration_runtime_ssis_catalog_tier_conflict"
    message: "pricing_tier and elastic_pool_name are mutually exclusive -- SSISDB lands either on a tier or in a pool"
    expression: "!(this.pricing_tier != '' && this.elastic_pool_name != '')"
  };
}

// A custom setup script container: Azure executes the container's
// main.cmd on every node when the runtime starts.
message AzureDataFactoryIntegrationRuntimeSsisCustomSetupScript {
  // The blob container's URI holding main.cmd and its installers.
  string blob_container_uri = 1 [(buf.validate.field).required = true];

  // A SAS token granting read access to the container. Stored by
  // Azure as a hidden secure string. SECRET.
  string sas_token = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.options.sensitive) = true
  ];
}

// Express custom setup: node preparation without a setup script
// container. Declare at least one of the four setup forms.
message AzureDataFactoryIntegrationRuntimeSsisExpressCustomSetup {
  // Environment variables set on every node, keyed by variable name.
  map<string, string> environment = 1;

  // The Azure PowerShell version installed on every node, e.g.
  // "7.2.1".
  string powershell_version = 2;

  // Windows credential-manager entries (cmdkey) created on every
  // node, so packages can authenticate to file shares and servers.
  repeated AzureDataFactoryIntegrationRuntimeSsisCommandKey command_key = 3;

  // Licensed third-party components installed on every node.
  repeated AzureDataFactoryIntegrationRuntimeSsisComponent component = 4;

  option (buf.validate.message).cel = {
    id: "integration_runtime_ssis_express_setup_at_least_one"
    message: "Declare at least one of environment, powershell_version, command_key, or component"
    expression: "size(this.environment) > 0 || this.powershell_version != '' || size(this.command_key) > 0 || size(this.component) > 0"
  };
}

// One Windows credential-manager entry (cmdkey) created on every
// node. Supply the password either inline or from Key Vault; when
// both are set, Azure receives the inline password (the Key Vault
// reference is ignored -- the provider's own precedence).
message AzureDataFactoryIntegrationRuntimeSsisCommandKey {
  // The target the credential applies to (server or share name).
  string target_name = 1 [(buf.validate.field).required = true];

  // The user name.
  string user_name = 2 [(buf.validate.field).required = true];

  // The password, inline. Stored by Azure as a hidden secure string.
  // SECRET. Prefer key_vault_password to keep the value out of
  // manifests.
  string password = 3 [(dev.planton.shared.options.sensitive) = true];

  // The password, read from Key Vault through a Key Vault linked
  // service -- the secretless alternative to password.
  AzureDataFactoryIntegrationRuntimeSsisKeyVaultSecretReference key_vault_password = 4;
}

// One licensed third-party component installed on every node. Supply
// the license either inline or from Key Vault; when both are set,
// Azure receives the inline license (the Key Vault reference is
// ignored -- the provider's own precedence).
message AzureDataFactoryIntegrationRuntimeSsisComponent {
  // The component's name, as its installer registers it.
  string name = 1 [(buf.validate.field).required = true];

  // The license key, inline. Stored by Azure as a hidden secure
  // string. SECRET. Prefer key_vault_license to keep the value out
  // of manifests.
  string license = 2 [(dev.planton.shared.options.sensitive) = true];

  // The license key, read from Key Vault through a Key Vault linked
  // service -- the secretless alternative to license.
  AzureDataFactoryIntegrationRuntimeSsisKeyVaultSecretReference key_vault_license = 3;
}

// A secret read from Key Vault through a Key Vault linked service in
// the same factory (the key_vault variant of
// AzureDataFactoryLinkedService).
message AzureDataFactoryIntegrationRuntimeSsisKeyVaultSecretReference {
  // The Key Vault linked service's name inside this factory --
  // defaults to referencing an AzureDataFactoryLinkedService's
  // linked_service_name output.
  dev.planton.shared.foreignkey.v1.StringValueOrRef linked_service_name = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureDataFactoryLinkedService,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.linked_service_name"
  ];

  // The secret's name in the vault.
  string secret_name = 2 [(buf.validate.field).required = true];

  // Values for the linked service's parameters, keyed by parameter
  // name.
  map<string, string> parameters = 3;

  // The secret's version -- omit for the latest.
  string secret_version = 4;
}

// Express virtual network injection: reaches the subnet without
// delegating it to Data Factory.
message AzureDataFactoryIntegrationRuntimeSsisExpressVnetIntegration {
  // The subnet the runtime reaches, by ARM ID -- defaults to
  // referencing an AzureSubnet's subnet_id output.
  //
  // The runtime is an ARM child of its factory and lives there; the
  // subnet is where its nodes attach, so on a diagram the reference is
  // access, not placement -- the AKS node pool's rule.
  dev.planton.shared.foreignkey.v1.StringValueOrRef subnet_id = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureSubnet,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.subnet_id"
  ];
}

// Standard virtual network injection: the SSIS nodes join a subnet
// you own. Address the network by ID plus subnet_name (the classic
// form), or the subnet by ID directly -- exactly one of the two.
message AzureDataFactoryIntegrationRuntimeSsisVnetIntegration {
  // The virtual network, by ARM ID -- pairs with subnet_name.
  // Defaults to referencing an AzureVirtualNetwork's
  // virtual_network_id output.
  //
  // The runtime is an ARM child of its factory and lives there; the
  // network is where its nodes attach, so on a diagram the reference is
  // access, not placement -- the AKS node pool's rule.
  dev.planton.shared.foreignkey.v1.StringValueOrRef vnet_id = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureVirtualNetwork,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.virtual_network_id"
  ];

  // The subnet, by ARM ID -- the direct alternative to vnet_id +
  // subnet_name. Defaults to referencing an AzureSubnet's subnet_id
  // output.
  //
  // Access, not placement, for the same reason as vnet_id above.
  dev.planton.shared.foreignkey.v1.StringValueOrRef subnet_id = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureSubnet,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.subnet_id"
  ];

  // The subnet's name inside vnet_id -- required with vnet_id,
  // meaningless with subnet_id.
  string subnet_name = 3;

  // Exactly TWO standard static public IPs (by ARM ID) the runtime
  // presents as its outbound addresses -- omit to let Azure assign
  // them. Each defaults to referencing an AzurePublicIp's
  // public_ip_id output.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef public_ips = 4 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AzurePublicIp,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.public_ip_id"
  ];

  option (buf.validate.message).cel = {
    id: "integration_runtime_ssis_vnet_exactly_one_address"
    message: "Set exactly one of vnet_id (with subnet_name) or subnet_id"
    expression: "(has(this.vnet_id) ? 1 : 0) + (has(this.subnet_id) ? 1 : 0) == 1"
  };

  option (buf.validate.message).cel = {
    id: "integration_runtime_ssis_vnet_subnet_name_pairing"
    message: "subnet_name is required with vnet_id (and is only meaningful there)"
    expression: "has(this.vnet_id) ? this.subnet_name != '' : this.subnet_name == ''"
  };

  option (buf.validate.message).cel = {
    id: "integration_runtime_ssis_vnet_two_public_ips"
    message: "public_ips takes exactly two addresses (or none, letting Azure assign them)"
    expression: "size(this.public_ips) == 0 || size(this.public_ips) == 2"
  };
}

// One package store: a named location (reached through a linked
// service) SSIS Studio can deploy packages to.
message AzureDataFactoryIntegrationRuntimeSsisPackageStore {
  // The store's display name in SSIS Studio.
  string name = 1 [(buf.validate.field).required = true];

  // The linked service carrying the store's location (an Azure file
  // share or SQL MSDB connection), by name -- defaults to
  // referencing an AzureDataFactoryLinkedService's
  // linked_service_name output.
  dev.planton.shared.foreignkey.v1.StringValueOrRef linked_service_name = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureDataFactoryLinkedService,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.linked_service_name"
  ];
}

// Scales the copy activities that run on the SSIS runtime.
message AzureDataFactoryIntegrationRuntimeSsisCopyComputeScale {
  // Data integration units powering each copy activity -- a multiple
  // of 4 between 4 and 256. Omit for Azure's default.
  int32 data_integration_unit = 1 [(buf.validate.field).cel = {
    id: "integration_runtime_ssis_copy_diu"
    message: "data_integration_unit must be a multiple of 4 between 4 and 256"
    expression: "this == 0 || (this >= 4 && this <= 256 && this % 4 == 0)"
  }];

  // Minutes the copy compute stays warm between activities -- at
  // least 5. Omit for Azure's default.
