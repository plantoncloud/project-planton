}

// The self-hosted agent registration. Creating it is free and
// instant: Azure allocates the registration and issues two
// authorization keys (surfaced as sensitive outputs); you install
// the integration runtime agent on your own machines and hand it a
// key to join. An empty block is a complete, valid registration.
message AzureDataFactoryIntegrationRuntimeSelfHosted {
  // Shares ANOTHER factory's self-hosted runtime instead of
  // registering new compute: the runtime this one links to, granted
  // through Azure RBAC. Omit for a primary (own-compute)
  // registration. A linked runtime issues no authorization keys of
  // its own.
  //
  // **ForceNew**: changing this destroys and recreates the
  // registration.
  AzureDataFactoryIntegrationRuntimeSelfHostedRbacAuthorization rbac_authorization = 1;

  // Whether interactive authoring runs self-contained on the
  // runtime's own nodes (instead of relaying through Azure) --
  // needed when the nodes cannot reach Azure's relay endpoints.
  // Unspecified applies false.
  bool self_contained_interactive_authoring_enabled = 2;
}

// Grants this registration the use of another factory's self-hosted
// runtime through Azure RBAC (the sharing feature): the target
// runtime's resource ID, on which this factory's identity holds the
// Contributor role.
message AzureDataFactoryIntegrationRuntimeSelfHostedRbacAuthorization {
  // The PRIMARY self-hosted integration runtime being shared, by ARM
  // ID ({factory_id}/integrationRuntimes/{name}) -- defaults to
  // referencing another AzureDataFactoryIntegrationRuntime's
  // integration_runtime_id output.
  dev.planton.shared.foreignkey.v1.StringValueOrRef resource_id = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureDataFactoryIntegrationRuntime,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.integration_runtime_id"
  ];
}
