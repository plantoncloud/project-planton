// How matched responses cache at the edge.
enum AzureFrontDoorRuleCacheBehavior {
  // Not specified -- invalid; every override makes an explicit cache
  // decision (use DISABLED to turn caching off for matched requests).
  azure_front_door_rule_cache_behavior_unspecified = 0;

  // Follow the origin's Cache-Control headers.
  HONOR_ORIGIN = 1;

  // Cache for cache_duration regardless of the origin's headers.
  OVERRIDE_ALWAYS = 2;

  // Cache for cache_duration only when the origin sends no caching
  // headers of its own.
  OVERRIDE_IF_ORIGIN_MISSING = 3;

  // Turn caching off for matched requests.
  DISABLED = 4;
}

// How query strings participate in the cache key for matched requests.
enum AzureFrontDoorRuleQueryStringCachingBehavior {
  // Not specified -- only legal when cache_behavior is unspecified or
  // DISABLED.
  azure_front_door_rule_query_string_caching_behavior_unspecified = 0;

  // Strip query strings from the cache key -- every variant shares one
  // entry.
  IGNORE_QUERY_STRING = 1;

  // Key the cache on the full query string -- each variant caches
  // separately.
  USE_QUERY_STRING = 2;

  // Ignore ONLY the parameters named in query_string_parameters.
  IGNORE_SPECIFIED_QUERY_STRINGS = 3;

  // Include ONLY the parameters named in query_string_parameters.
  INCLUDE_SPECIFIED_QUERY_STRINGS = 4;
}
