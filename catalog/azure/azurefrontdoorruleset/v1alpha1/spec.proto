// AzureFrontDoorRuleActions holds the actions a rule applies when its
// conditions match: at most one redirect OR one rewrite (never both --
// they contradict), any number of header edits, and at most one
// route-configuration override (which a redirect also excludes -- a
// redirected request never reaches the route) -- at most 5 actions
// total (Azure's cap).
message AzureFrontDoorRuleActions {
  // Answer the request with an HTTP redirect instead of forwarding it
  // to the origin. Mutually exclusive with url_rewrite and with
  // route_configuration_override.
  AzureFrontDoorRuleUrlRedirectAction url_redirect = 1;

  // Rewrite the request path before forwarding it to the origin (the
  // client never sees the rewritten path). Mutually exclusive with
  // url_redirect.
  AzureFrontDoorRuleUrlRewriteAction url_rewrite = 2;

  // Add, overwrite, or delete headers on the request Front Door
  // forwards to the origin.
  repeated AzureFrontDoorRuleHeaderAction request_headers = 3;

  // Add, overwrite, or delete headers on the response Front Door
  // returns to the client (e.g. security headers).
  repeated AzureFrontDoorRuleHeaderAction response_headers = 4;

  // Override the route's own forwarding and caching configuration for
  // requests this rule matches -- e.g. send matched traffic to a
  // different origin group, or disable caching for authenticated paths.
  // Mutually exclusive with url_redirect: a redirected request is
  // answered at the edge and never forwards, so there is nothing for
  // the override to configure.
  AzureFrontDoorRuleRouteConfigurationOverrideAction route_configuration_override = 5;

  option (buf.validate.message).cel = {
    id: "front_door_rule_actions_at_least_one"
    message: "a rule must carry at least one action -- a rule with conditions but no actions does nothing and Azure rejects it"
    expression: "has(this.url_redirect) || has(this.url_rewrite) || this.request_headers.size() > 0 || this.response_headers.size() > 0 || has(this.route_configuration_override)"
  };
  option (buf.validate.message).cel = {
    id: "front_door_rule_actions_max_five"
    message: "a rule may carry at most 5 actions in total -- split the policy into additional rules if you need more"
    expression: "(has(this.url_redirect) ? 1 : 0) + (has(this.url_rewrite) ? 1 : 0) + this.request_headers.size() + this.response_headers.size() + (has(this.route_configuration_override) ? 1 : 0) <= 5"
  };
  option (buf.validate.message).cel = {
    id: "front_door_rule_actions_redirect_xor_rewrite"
    message: "url_redirect and url_rewrite cannot both be set on one rule -- a redirect answers the client directly while a rewrite forwards to the origin, so the two contradict"
    expression: "!(has(this.url_redirect) && has(this.url_rewrite))"
  };
  option (buf.validate.message).cel = {
    id: "front_door_rule_actions_redirect_excludes_override"
    message: "url_redirect and route_configuration_override cannot both be set on one rule -- a redirected request is answered at the edge and never forwards, so there is nothing for the override to configure"
    expression: "!(has(this.url_redirect) && has(this.route_configuration_override))"
  };
}

// Answer matched requests with an HTTP redirect. Each destination part
// left empty preserves the corresponding part of the incoming request,
// which is how a scheme-only or host-only redirect is expressed.
message AzureFrontDoorRuleUrlRedirectAction {
  // The redirect's HTTP status: MOVED (301), FOUND (302),
  // TEMPORARY_REDIRECT (307), or PERMANENT_REDIRECT (308). The 30x
  // codes preserve the request method; 301/302 may downgrade POST to
  // GET in older clients.
  AzureFrontDoorRuleRedirectType redirect_type = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // The scheme of the redirect target: MATCH_REQUEST (default,
  // preserve the incoming scheme), HTTP_ONLY, or HTTPS_ONLY. An
  // HTTPS_ONLY redirect with everything else preserved is the classic
  // HTTP-to-HTTPS upgrade.
  AzureFrontDoorRuleForwardingProtocol redirect_protocol = 2 [(buf.validate.field).enum.defined_only = true];

  // The hostname to redirect to, up to 2048 characters. Leave empty to
  // preserve the incoming host (e.g. for a scheme- or path-only
  // redirect).
  string destination_hostname = 3 [(buf.validate.field).string.max_len = 2048];

  // The path to redirect to; must start with '/'. Leave empty to
  // preserve the incoming path.
  string destination_path = 4 [(buf.validate.field).cel = {
    id: "front_door_redirect_destination_path_format"
    message: "destination_path must begin with '/' -- leave it empty to preserve the incoming path"
    expression: "this == '' || this.startsWith('/')"
  }];

  // The query string of the redirect target in key=value&key2=value2
  // form, WITHOUT the leading '?' (Front Door adds it), up to 2048
  // characters. Leave empty to preserve the incoming query string.
  string query_string = 5 [
    (buf.validate.field).string.max_len = 2048,
    (buf.validate.field).cel = {
      id: "front_door_redirect_query_string_format"
      message: "query_string must not start with '?' -- Front Door adds the separator automatically"
      expression: "!this.startsWith('?')"
    }
  ];

  // The fragment (the part after '#') of the redirect target, without
  // the '#', up to 1024 characters. Leave empty for no fragment.
  string destination_fragment = 6 [(buf.validate.field).string.max_len = 1024];
}

// The HTTP status a redirect answers with.
enum AzureFrontDoorRuleRedirectType {
  // Not specified -- invalid; pick a concrete redirect status.
  azure_front_door_rule_redirect_type_unspecified = 0;

  // 301 Moved Permanently -- cached by clients; may downgrade POST to
  // GET in older clients.
  MOVED = 1;

  // 302 Found -- temporary; may downgrade POST to GET in older clients.
  FOUND = 2;

  // 307 Temporary Redirect -- preserves the request method.
  TEMPORARY_REDIRECT = 3;

  // 308 Permanent Redirect -- preserves the request method; cached.
  PERMANENT_REDIRECT = 4;
}

// A protocol choice shared by the redirect action (the scheme of the
// redirect target) and the route-configuration override (the protocol
// toward the origin).
enum AzureFrontDoorRuleForwardingProtocol {
  // Not specified -- deploys MATCH_REQUEST, Azure's default, for
  // redirects; for the route-configuration override the field is only
  // sent when a value is chosen.
  azure_front_door_rule_forwarding_protocol_unspecified = 0;

  // Mirror the incoming request's protocol.
  MATCH_REQUEST = 1;

  // Always HTTP.
  HTTP_ONLY = 2;

  // Always HTTPS.
  HTTPS_ONLY = 3;
}

// Rewrite the request path before forwarding to the origin. The client
// never sees the rewritten path (contrast with a redirect).
message AzureFrontDoorRuleUrlRewriteAction {
  // The path prefix to match and replace, e.g. "/v1". Use "/" to
  // replace the whole path.
  string source_pattern = 1 [(buf.validate.field).required = true];

  // What the matched prefix is replaced with, e.g. "/api/v1".
  string destination = 2 [(buf.validate.field).required = true];

  // Keep the path remainder after the matched prefix and append it to
  // the destination (true), or forward exactly the destination
  // (false, Azure's default). With source "/v1", destination "/api"
  // and preserve on, "/v1/users" becomes "/api/users".
  bool preserve_unmatched_path = 3;
}

// Add, overwrite, or delete one header (on the origin-bound request or
// the client-bound response, depending on which list the action sits in).
message AzureFrontDoorRuleHeaderAction {
  // APPEND adds the header (joining an existing value), OVERWRITE
  // replaces it, DELETE removes it.
  AzureFrontDoorRuleHeaderActionType header_action = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // The header to act on.
  string header_name = 2 [(buf.validate.field).required = true];

  // The value to append or overwrite with. Required for APPEND and
  // OVERWRITE; must be empty for DELETE (there is nothing to set when
  // removing a header).
  string value = 3;

  option (buf.validate.message).cel = {
    id: "front_door_header_action_value"
    message: "value is required when header_action is APPEND or OVERWRITE, and must be empty when it is DELETE"
    expression: "this.header_action == 3 ? this.value == '' : this.value != ''"
  };
}

// What a header action does to its header.
enum AzureFrontDoorRuleHeaderActionType {
  // Not specified -- invalid; pick APPEND, OVERWRITE, or DELETE.
  azure_front_door_rule_header_action_type_unspecified = 0;

  // Add the header, joining any existing value.
  APPEND = 1;

  // Replace the header's value (or add it if absent).
  OVERWRITE = 2;

  // Remove the header.
  DELETE = 3;
}

// Override the route's own forwarding and caching configuration for
// matched requests. Two independent knobs live here: WHERE the request
// goes (origin_group_id + forwarding_protocol, set together) and HOW it
// caches (cache_behavior and its dependent fields).
message AzureFrontDoorRuleRouteConfigurationOverrideAction {
  // Send matched requests to a different origin group than the route's
  // own, by ARM ID. References an AzureFrontDoorOriginGroup's
  // origin_group_id output. When set, forwarding_protocol must be
  // chosen too; when unset, the route's own origin group keeps serving.
  // The rule set lives in its profile and steers TO the origin group, so
  // the reference is access, not placement, on a diagram.
  dev.planton.shared.foreignkey.v1.StringValueOrRef origin_group_id = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureFrontDoorOriginGroup,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.origin_group_id"
  ];

  // The protocol toward the overriding origin group. Required when
  // origin_group_id is set; must be left unspecified otherwise (it
  // qualifies the override's origin, not the route's).
  AzureFrontDoorRuleForwardingProtocol forwarding_protocol = 2 [(buf.validate.field).enum.defined_only = true];

  // How matched responses cache at the edge: HONOR_ORIGIN follows the
  // origin's Cache-Control, the OVERRIDE_* behaviors force the
  // cache_duration, and DISABLED turns caching off for matched
  // requests. Required -- every override makes an explicit cache
  // decision (DISABLED is the "no caching" choice; there is no
  // leave-the-route-alone value on this action).
  AzureFrontDoorRuleCacheBehavior cache_behavior = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // How long forced caching lasts, in "d.HH:MM:SS" (days 1-365) or
  // "HH:MM:SS" format, e.g. "1.12:00:00" or "00:05:00". Required with
  // the OVERRIDE_* behaviors; forbidden with HONOR_ORIGIN (the origin
  // decides) and DISABLED (nothing caches).
  string cache_duration = 4 [(buf.validate.field).cel = {
    id: "front_door_override_cache_duration_format"
    message: "cache_duration must be d.HH:MM:SS (days 1-365) or HH:MM:SS, e.g. \"1.12:00:00\" or \"00:05:00\""
    expression: "this == '' || this.matches('^(([1-9]|[1-9][0-9]|[12][0-9][0-9]|3[0-5][0-9]|36[0-5])\\\\.)?([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$')"
  }];

  // How query strings participate in the cache key for matched
  // requests. Required whenever cache_behavior enables caching
  // (HONOR_ORIGIN or OVERRIDE_*); forbidden with DISABLED.
  AzureFrontDoorRuleQueryStringCachingBehavior query_string_caching_behavior = 5 [(buf.validate.field).enum.defined_only = true];

  // The query-string parameter NAMES the *_SPECIFIED caching behaviors
  // operate on, up to 100. Required with those two behaviors; forbidden
  // with the other two.
  repeated string query_string_parameters = 6 [(buf.validate.field).repeated.max_items = 100];

  // Compress eligible matched responses at the edge. Only meaningful
  // when cache_behavior enables caching (compression is part of the
  // cache configuration); with DISABLED it is ignored. Default false.
  optional bool compression_enabled = 7 [(dev.planton.shared.options.default) = "false"];

  option (buf.validate.message).cel = {
    id: "front_door_override_origin_needs_protocol"
    message: "forwarding_protocol must be set when origin_group_id is set (it qualifies the overriding origin), and must be left unspecified when there is no origin override"
    expression: "has(this.origin_group_id) ? this.forwarding_protocol != 0 : this.forwarding_protocol == 0"
  };
  option (buf.validate.message).cel = {
    id: "front_door_override_disabled_forbids_cache_fields"
    message: "with cache_behavior DISABLED nothing caches, so cache_duration, query_string_caching_behavior, and query_string_parameters must stay unset"
    expression: "this.cache_behavior != 4 || (this.cache_duration == '' && this.query_string_caching_behavior == 0 && this.query_string_parameters.size() == 0)"
  };
  option (buf.validate.message).cel = {
    id: "front_door_override_enabled_requires_qscb"
    message: "query_string_caching_behavior is required when cache_behavior enables caching (HONOR_ORIGIN or the OVERRIDE_* behaviors)"
    expression: "!(this.cache_behavior in [1, 2, 3]) || this.query_string_caching_behavior != 0"
  };
  option (buf.validate.message).cel = {
    id: "front_door_override_duration_by_behavior"
    message: "cache_duration is required with OVERRIDE_ALWAYS and OVERRIDE_IF_ORIGIN_MISSING, and must stay unset with HONOR_ORIGIN (the origin's Cache-Control decides)"
