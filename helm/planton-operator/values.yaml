# -- Planton Operator Helm Chart values.
# See README.md for full documentation.

crds:
  # -- Install the PlantonPlatform and PlantonIdentityProvider definitions as
  # part of this release, and upgrade them with it. Set false only when another
  # release on this cluster already owns them (one Planton operator per
  # cluster) -- the operator cannot run without them.
  enabled: true
  # -- Keep the definitions when this release is uninstalled. Deleting a
  # definition deletes every resource of that kind, so with keep=false
  # `helm uninstall` removes every PlantonPlatform on the cluster and the
  # operator tears down every platform they describe.
  keep: true

image:
  # -- Container image repository.
  repository: ghcr.io/plantonhq/planton/operator
  # -- Container image tag (defaults to chart appVersion).
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Optional image pull secrets for private registries.
imagePullSecrets: []

# -- Override the release name prefix used in resource names.
nameOverride: ""
# -- Override the full resource name (disables prefix generation).
fullnameOverride: ""

# -- Number of operator replicas. Use 2+ with leader election for HA.
replicaCount: 1

leaderElection:
  # -- Enable leader election for controller manager.
  # Required when running multiple replicas for high availability.
  enabled: true

healthProbe:
  # -- Port for health check endpoints (/healthz and /readyz).
  port: 8081

janitor:
  # -- How often the operator re-checks for cluster-scoped objects it installed
  # that no platform needs any more: a deleted platform's cluster RBAC, and the
  # shared database and build operators once no platform remains on the cluster
  # (kept, and explained on their definitions, while anything else still uses
  # them). Deleting a platform sweeps immediately; this tick converges what an
  # operator restart or a slow garbage collection left behind. A Go duration.
  sweepInterval: 10m

resources:
  requests:
    cpu: 10m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  # -- Create a ServiceAccount for the operator pod.
  create: true
  # -- Annotations for the ServiceAccount (e.g., for IRSA or Workload Identity).
  annotations: {}
  # -- Override the ServiceAccount name. Defaults to the release fullname.
  name: ""

# -- Additional labels to apply to all resources.
commonLabels: {}

# -- Additional annotations for the Deployment pod template.
podAnnotations: {}

# -- Node selector for pod scheduling.
nodeSelector: {}

# -- Tolerations for pod scheduling.
tolerations: []

# -- Affinity rules for pod scheduling.
affinity: {}
