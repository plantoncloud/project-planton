    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          PlantonPlatform is the Schema for deploying a complete Planton platform
          on any Kubernetes cluster. A single PlantonPlatform resource orchestrates
          the full stack: data layer, supporting services, and application layer.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PlantonPlatformSpec defines the desired state of a self-hosted Planton deployment.
              A minimal spec requires only the version field; all other fields have sensible defaults.
            properties:
              bootstrap:
                description: |-
                  bootstrap seeds the first-boot workspace: a default organization with a
                  starter environment, and the admins who own it. The first declared admin
                  to sign in lands inside a ready workspace as its owner and the install's
                  platform operator -- no create-org ceremony. Every field is optional;
                  defaults produce an organization and environment both named "default",
                  with spec.identity.adminEmail as the sole admin.
                properties:
                  admins:
                    description: |-
                      admins are the emails granted organization ownership AND the install's
                      platform-operator role -- at boot when their account already exists, or
                      the moment they first sign in. Editing this list takes effect on the
                      next control-plane restart (declarative, never fire-once). Defaults to
                      [spec.identity.adminEmail] when that field is set.
                    items:
                      type: string
                    type: array
                  environment:
                    description: environment is the starter environment seeded inside
                      the organization.
                    properties:
                      name:
                        description: name is the environment's display name. Defaults
                          to the slug.
                        type: string
                      slug:
                        default: default
                        description: slug is the environment's URL-safe identifier
                          within the organization.
                        type: string
                    type: object
                  iacProvisioner:
                    default: tofu
                    description: |-
                      iacProvisioner is the IaC engine seeded as the organization's deploy
                      default. "tofu" (OpenTofu, the default) and "terraform" both execute
                      with the bundled OpenTofu binary against the Terraform-compatible
                      module catalog. Seeded create-once: a different choice made later in
                      the console is never overwritten by a restart. Pulumi is deliberately
                      not accepted here -- it has no zero-config state backend (its file
                      backend requires a state-encryption passphrase), so seeding it as the
                      default would produce an install where every deploy fails.
                    enum:
                    - tofu
                    - terraform
                    type: string
                  organization:
                    description: organization is the default organization every declared
                      admin owns.
                    properties:
                      name:
                        description: name is the organization's display name. Defaults
                          to the slug.
                        type: string
                      slug:
                        default: default
                        description: slug is the organization's URL-safe identifier
                          (also its id).
                        type: string
                    type: object
                  secretBackend:
                    description: |-
                      secretBackend declares the organization's default secret backend,
                      seeded create-once at boot (a choice made later in the console is never
                      overwritten). Both supported kinds are credential-free by construction:
                      "platform" stores secrets in the bundled vault (deployed by default;
                      incompatible with spec.vault.enabled: false) and is seeded
                      automatically when the vault runs and nothing is declared here;
                      "awsSecretsManager" stores secrets in AWS Secrets Manager, reached with
                      the control plane pod's own cloud identity (workload identity via
                      spec.controlPlane.serviceAccountAnnotations, instance profiles, or env
                      credentials) -- no key is ever typed or stored. When neither applies,
                      no default backend exists and the console guides secret-related
                      features until one is created.
                    properties:
                      awsSecretsManager:
                        description: awsSecretsManager configures the awsSecretsManager
                          type.
                        properties:
                          region:
                            description: region is the AWS region secrets are stored
                              in (e.g. "ap-south-1").
                            type: string
                        required:
                        - region
                        type: object
                      type:
                        description: |-
                          type selects the backend kind: "platform" (the bundled vault) or
                          "awsSecretsManager" (ambient-authenticated AWS Secrets Manager).
                        enum:
                        - platform
                        - awsSecretsManager
                        type: string
                    required:
                    - type
                    type: object
                    x-kubernetes-validations:
                    - message: awsSecretsManager.region is required when type is awsSecretsManager
                      rule: self.type != 'awsSecretsManager' || (has(self.awsSecretsManager)
                        && size(self.awsSecretsManager.region) > 0)
                type: object
              build:
                description: |-
                  build configures the pipeline-build capability: Tekton on this cluster,
                  the runner's build worker and webhook, and the seeded build routing.
                  Enabled by default -- builds power Service Hub, and an install without
                  them is half a product; every field is optional.
                properties:
                  enabled:
                    default: true
                    description: |-
                      enabled controls whether the build capability is deployed. Default
                      true: builds power Service Hub -- an install without them can deploy
                      infrastructure but never build a service from source, which is half
                      the product. Opting OUT is the deliberate act (e.g. an install that
                      only manages infrastructure). Builds also require the runner: with
                      spec.runner disabled, builds follow it off.
                    type: boolean
                type: object
              components:
                description: |-
                  components toggles optional platform capabilities that are disabled by default
                  to keep the minimal deployment footprint small.
                properties:
                  authorization:
                    description: |-
                      authorization deploys OpenFGA and switches the control plane to
                      policy-engine authorization (fine-grained RBAC). Disabled by default: the
                      control plane runs the built-in allow-owner authorization arm, which needs
                      no OpenFGA. Enable this for multi-tenant, per-resource access control.
                    properties:
                      enabled:
                        default: false
                        description: enabled controls whether this component is deployed.
                        type: boolean
                    type: object
                  graph:
                    description: |-
                      graph configures Neo4j for relationship graph queries.
                      Disabled by default.
                    properties:
                      enabled:
                        default: false
                        description: enabled controls whether Neo4j is deployed.
                        type: boolean
                      storageClassName:
                        description: |-
                          storageClassName pins the Neo4j data volume to a StorageClass.
                          Defaults to spec.storage.storageClassName, then the cluster default.
                        type: string
                      storageSize:
                        anyOf:
                        - type: integer
                        - type: string
                        description: |-
                          storageSize is the persistent volume size for Neo4j data. Defaults to
                          spec.storage.size, then 10Gi.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    type: object
                type: object
              console:
                description: |-
                  console configures the Planton web console (Next.js).
                  The console is always deployed. Image defaults to the official
                  GHCR image tagged with spec.version.
                properties:
                  externalConfigSecretName:
                    description: |-
                      externalConfigSecretName references a user-created Secret in the same
                      namespace containing external configuration (Auth0, NextAuth, etc.).
                      All keys in the Secret are injected as environment variables via envFrom.
                    type: string
                  image:
                    description: image overrides the default container image for the
                      web console.
                    properties:
                      repository:
                        description: |-
                          repository is the full container image repository
                          (e.g., "ghcr.io/plantonhq/planton/control-plane").
                        type: string
                      tag:
                        description: tag overrides the image tag. Defaults to spec.version
                          when empty.
                        type: string
                    type: object
                  replicas:
                    default: 1
                    description: replicas sets the number of web console pods.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              controlPlane:
                description: |-
                  controlPlane configures the Planton control plane monolith.
                  The control plane is always deployed. Image defaults to the official
                  GHCR image tagged with spec.version.
                properties:
                  externalConfigSecretName:
                    description: |-
                      externalConfigSecretName references a user-created Secret in the same
                      namespace containing external service credentials (Auth0, Stripe,
                      GitHub, etc.). All keys in the Secret are injected as environment
                      variables via envFrom. The control plane will fail to start without
                      this configuration when running with the real (non-placeholder) image.
                    type: string
                  iacModulesVersion:
                    description: |-
                      iacModulesVersion overrides the release version at which the platform
                      resolves official IaC module artifacts (both engines: the OpenTofu
                      module zips and the Pulumi module binaries ride the same release tag).
                      It feeds the control plane's PLANTON_VERSION environment variable and
                      controls nothing else -- deliberately NOT the platform image version
                      (spec.version) and NOT the infra-charts pin (charts are validated by
                      the control plane's own protos, so their tag stays compile-locked to
                      the image). Unset means the operator's verified default pin; setting
                      it is a deliberate operator act, e.g. adopting a newer module release
                      ahead of an operator upgrade. Every value must have a published
                      artifact set under downloads.planton.dev/releases/<version>/ or
                      deploys fail at module download.
                    pattern: ^v\d+\.\d+\.\d+$
                    type: string
                  image:
                    description: image overrides the default container image for the
                      control plane.
                    properties:
                      repository:
                        description: |-
                          repository is the full container image repository
                          (e.g., "ghcr.io/plantonhq/planton/control-plane").
                        type: string
                      tag:
                        description: tag overrides the image tag. Defaults to spec.version
                          when empty.
                        type: string
                    type: object
                  replicas:
                    default: 1
                    description: replicas sets the number of control plane pods.
                    format: int32
                    minimum: 1
                    type: integer
                  serviceAccountAnnotations:
                    additionalProperties:
                      type: string
                    description: |-
                      serviceAccountAnnotations are applied to the control plane pod's
                      dedicated Kubernetes ServiceAccount. This is the workload-identity seam
                      for the control plane's OWN cloud calls -- ambient-authenticated secret
                      backends and their KMS encryption keys (e.g.
                      eks.amazonaws.com/role-arn: <role> on EKS, the GKE/AKS equivalents
                      elsewhere). The ServiceAccount always exists, so adding annotations
                      later is a pure spec edit -- no pod surgery. Distinct from
                      spec.runner.serviceAccountAnnotations, which grants the DEPLOY worker
                      its cloud identity; this grants the platform itself one.
                    type: object
                type: object
              database:
                description: |-
                  database configures storage for the data-layer components
                  (PostgreSQL and Redis).
                properties:
                  postgresql:
                    description: postgresql configures the platform's PostgreSQL cluster.
                    properties:
                      backup:
                        description: |-
                          backup declares where the platform's own database is backed up and
                          how (see PostgreSQLBackupSpec). Absent means no backup: the database
                          lives on one volume in this cluster and nothing copies it anywhere.
                          The Backup column of `kubectl get plantonplatform` says which.
                        properties:
                          objectStore:
                            description: |-
                              objectStore is the bucket the backups go to and how the database's pods
                              authenticate to it.
                            properties:
                              azureBlob:
                                description: 'AzureBlobObjectStoreSpec: Azure Blob
                                  Storage.'
                                properties:
                                  credentialsSecretName:
                                    description: |-
                                      credentialsSecretName names a Secret in the platform's namespace with
                                      key AZURE_STORAGE_CONNECTION_STRING. Empty means Azure AD workload
                                      identity on the database's ServiceAccount -- the preferred posture; see
                                      serviceAccountAnnotations.
                                    type: string
                                  storageAccount:
                                    description: |-
                                      storageAccount is the account the container belongs to. Identifies the
                                      endpoint for the keyless posture.
                                    minLength: 1
                                    type: string
                                required:
                                - storageAccount
                                type: object
                              destinationPath:
                                description: |-
                                  destinationPath is the bucket and prefix: s3://bucket/path (s3 and
                                  r2), gs://bucket/path (gcs), or the container URL (azureBlob).
                                minLength: 1
                                type: string
                              gcs:
                                description: 'GCSObjectStoreSpec: Google Cloud Storage.'
                                properties:
                                  credentialsSecretName:
                                    description: |-
                                      credentialsSecretName names a Secret in the platform's namespace with
                                      key APPLICATION_CREDENTIALS holding a service-account JSON key. Empty
                                      means GKE Workload Identity on the database's ServiceAccount -- the
                                      preferred posture; see serviceAccountAnnotations.
                                    type: string
                                type: object
                              r2:
                                description: |-
                                  R2ObjectStoreSpec: Cloudflare R2 through its S3 API. R2 has no keyless
                                  posture; the key pair is derived from a Cloudflare API token carrying an
                                  R2 permission group (access key id = the token's id; secret access key =
                                  the lowercase hex SHA-256 of the token's value) and always arrives as a
                                  Secret. The endpoint follows from the account and the bucket's
                                  jurisdiction, and the only region R2 accepts is set for you.
                                properties:
                                  accountId:
                                    description: accountId is the Cloudflare account
                                      that owns the bucket.
                                    minLength: 1
                                    type: string
                                  credentialsSecretName:
                                    description: |-
                                      credentialsSecretName names a Secret in the platform's namespace with
                                      keys ACCESS_KEY_ID and SECRET_ACCESS_KEY.
                                    minLength: 1
                                    type: string
                                  jurisdiction:
                                    description: |-
                                      jurisdiction is the bucket's data residency: empty or "default" for
                                      standard storage, else "eu", "fedramp", or "us". A jurisdictional
                                      bucket is served ONLY through its own host, so this must match how the
                                      bucket was created.
                                    enum:
                                    - ""
                                    - default
                                    - eu
                                    - fedramp
                                    - us
                                    type: string
                                required:
                                - accountId
                                - credentialsSecretName
                                type: object
                              s3:
                                description: 'S3ObjectStoreSpec: Amazon S3, or any
                                  S3-compatible store by endpoint.'
                                properties:
                                  credentialsSecretName:
                                    description: |-
                                      credentialsSecretName names a Secret in the platform's namespace with
                                      keys ACCESS_KEY_ID and SECRET_ACCESS_KEY. Empty means the database's
                                      pods inherit an IAM role (IRSA, EKS Pod Identity, an instance profile)
                                      -- the preferred posture; see serviceAccountAnnotations.
                                    type: string
                                  endpointCASecretRef:
                                    description: |-
                                      endpointCASecretRef names the CA bundle a private endpoint's TLS chains
                                      to, when the system trust store does not carry it.
                                    properties:
                                      key:
                                        description: key within the Secret.
                                        minLength: 1
                                        type: string
                                      name:
                                        description: name of the Secret.
                                        minLength: 1
                                        type: string
                                    required:
                                    - key
                                    - name
                                    type: object
                                  endpointURL:
                                    description: |-
                                      endpointURL points at an S3-compatible store (MinIO, Ceph, a NAS).
                                      Empty means Amazon S3.
                                    type: string
                                  region:
                                    description: |-
                                      region of the bucket. Required by Amazon S3; some compatible stores
                                      ignore it.
                                    type: string
                                type: object
                            required:
                            - destinationPath
                            type: object
                            x-kubernetes-validations:
                            - message: 'an object store names exactly one backend:
                                s3, gcs, azureBlob, or r2'
                              rule: '[has(self.s3), has(self.gcs), has(self.azureBlob),
                                has(self.r2)].filter(x, x).size() == 1'
                            - message: an s3 or r2 store's destinationPath starts
                                with s3://
                              rule: '!(has(self.s3) || has(self.r2)) || self.destinationPath.startsWith(''s3://'')'
                            - message: a gcs store's destinationPath starts with gs://
                              rule: '!has(self.gcs) || self.destinationPath.startsWith(''gs://'')'
                            - message: an azureBlob store's destinationPath is the
                                container URL, https://<account>.blob.core.windows.net/<container>/<path>
                              rule: '!has(self.azureBlob) || self.destinationPath.startsWith(''https://'')'
                          retentionPolicy:
                            default: 30d
                            description: |-
                              retentionPolicy is how long the store keeps backups and the WAL that
                              goes with them: an integer and a unit, d (days), w (weeks), or m
                              (months). Default 30d.
                            pattern: ^[1-9][0-9]*[dwm]$
                            type: string
                          schedule:
                            default: 0 0 2 * * *
                            description: |-
                              schedule is when base backups run, as a SIX-field cron with seconds
                              first (the database operator's grammar): "0 0 2 * * *" is daily at
                              02:00 UTC, the default. The first base backup always runs the moment
                              backups are declared, whatever this says.
                            type: string
                          serviceAccountAnnotations:
                            additionalProperties:
                              type: string
                            description: |-
                              serviceAccountAnnotations go on the ServiceAccount the database operator
                              creates for the database's own pods (it names that account after the
                              PostgreSQL cluster: "{platform}-postgres"). This is the keyless backup
                              identity: EKS "eks.amazonaws.com/role-arn", GKE
                              "iam.gke.io/gcp-service-account", AKS "azure.workload.identity/client-id"
                              -- the cloud-side binding is written against that account, and no
                              credential exists in the cluster. On GCS the bound identity needs BOTH
                              roles/storage.objectAdmin and roles/storage.legacyBucketReader: the
                              plugin verifies the destination with a bucket-level read before every
                              archive, and object administration alone does not carry it.
                            type: object
                        required:
                        - objectStore
                        type: object
                      recoverFrom:
                        description: |-
                          recoverFrom restores this platform's database from another platform's
                          archive instead of creating it empty (see PostgreSQLRecoverFromSpec).
                          Honored only when the database is first created.
                        properties:
                          objectStore:
                            description: |-
                              objectStore is the store the source platform archived to. Recovery only
                              reads from it; this platform's own backups go to spec.database.postgresql.backup.
                            properties:
                              azureBlob:
                                description: 'AzureBlobObjectStoreSpec: Azure Blob
                                  Storage.'
                                properties:
                                  credentialsSecretName:
                                    description: |-
                                      credentialsSecretName names a Secret in the platform's namespace with
                                      key AZURE_STORAGE_CONNECTION_STRING. Empty means Azure AD workload
                                      identity on the database's ServiceAccount -- the preferred posture; see
                                      serviceAccountAnnotations.
                                    type: string
                                  storageAccount:
                                    description: |-
                                      storageAccount is the account the container belongs to. Identifies the
                                      endpoint for the keyless posture.
                                    minLength: 1
                                    type: string
                                required:
                                - storageAccount
                                type: object
                              destinationPath:
                                description: |-
                                  destinationPath is the bucket and prefix: s3://bucket/path (s3 and
                                  r2), gs://bucket/path (gcs), or the container URL (azureBlob).
                                minLength: 1
                                type: string
                              gcs:
                                description: 'GCSObjectStoreSpec: Google Cloud Storage.'
                                properties:
                                  credentialsSecretName:
                                    description: |-
                                      credentialsSecretName names a Secret in the platform's namespace with
                                      key APPLICATION_CREDENTIALS holding a service-account JSON key. Empty
                                      means GKE Workload Identity on the database's ServiceAccount -- the
                                      preferred posture; see serviceAccountAnnotations.
                                    type: string
                                type: object
                              r2:
                                description: |-
                                  R2ObjectStoreSpec: Cloudflare R2 through its S3 API. R2 has no keyless
                                  posture; the key pair is derived from a Cloudflare API token carrying an
                                  R2 permission group (access key id = the token's id; secret access key =
                                  the lowercase hex SHA-256 of the token's value) and always arrives as a
                                  Secret. The endpoint follows from the account and the bucket's
                                  jurisdiction, and the only region R2 accepts is set for you.
                                properties:
                                  accountId:
                                    description: accountId is the Cloudflare account
                                      that owns the bucket.
                                    minLength: 1
                                    type: string
                                  credentialsSecretName:
                                    description: |-
                                      credentialsSecretName names a Secret in the platform's namespace with
                                      keys ACCESS_KEY_ID and SECRET_ACCESS_KEY.
                                    minLength: 1
                                    type: string
                                  jurisdiction:
                                    description: |-
                                      jurisdiction is the bucket's data residency: empty or "default" for
                                      standard storage, else "eu", "fedramp", or "us". A jurisdictional
                                      bucket is served ONLY through its own host, so this must match how the
                                      bucket was created.
                                    enum:
                                    - ""
                                    - default
                                    - eu
                                    - fedramp
                                    - us
                                    type: string
                                required:
                                - accountId
                                - credentialsSecretName
                                type: object
                              s3:
                                description: 'S3ObjectStoreSpec: Amazon S3, or any
                                  S3-compatible store by endpoint.'
                                properties:
                                  credentialsSecretName:
                                    description: |-
                                      credentialsSecretName names a Secret in the platform's namespace with
                                      keys ACCESS_KEY_ID and SECRET_ACCESS_KEY. Empty means the database's
                                      pods inherit an IAM role (IRSA, EKS Pod Identity, an instance profile)
                                      -- the preferred posture; see serviceAccountAnnotations.
                                    type: string
                                  endpointCASecretRef:
                                    description: |-
                                      endpointCASecretRef names the CA bundle a private endpoint's TLS chains
                                      to, when the system trust store does not carry it.
                                    properties:
                                      key:
                                        description: key within the Secret.
                                        minLength: 1
                                        type: string
                                      name:
                                        description: name of the Secret.
                                        minLength: 1
                                        type: string
                                    required:
                                    - key
                                    - name
                                    type: object
                                  endpointURL:
                                    description: |-
                                      endpointURL points at an S3-compatible store (MinIO, Ceph, a NAS).
                                      Empty means Amazon S3.
                                    type: string
                                  region:
                                    description: |-
                                      region of the bucket. Required by Amazon S3; some compatible stores
                                      ignore it.
                                    type: string
                                type: object
                            required:
                            - destinationPath
                            type: object
                            x-kubernetes-validations:
                            - message: 'an object store names exactly one backend:
                                s3, gcs, azureBlob, or r2'
                              rule: '[has(self.s3), has(self.gcs), has(self.azureBlob),
                                has(self.r2)].filter(x, x).size() == 1'
                            - message: an s3 or r2 store's destinationPath starts
                                with s3://
                              rule: '!(has(self.s3) || has(self.r2)) || self.destinationPath.startsWith(''s3://'')'
                            - message: a gcs store's destinationPath starts with gs://
                              rule: '!has(self.gcs) || self.destinationPath.startsWith(''gs://'')'
                            - message: an azureBlob store's destinationPath is the
                                container URL, https://<account>.blob.core.windows.net/<container>/<path>
                              rule: '!has(self.azureBlob) || self.destinationPath.startsWith(''https://'')'
                          serverName:
                            description: |-
                              serverName is the name the source's archive is filed under -- printed
                              on the source platform's status (status.backup.serverName), or read from
                              the bucket's own listing when the source is gone. Every platform archives
                              under its own name, so a restored platform never writes over its source.
                            minLength: 1
                            type: string
                          targetTime:
                            description: |-
                              targetTime recovers to a point in time (RFC 3339). Empty recovers to
                              the end of the archive.
                            type: string
                        required:
                        - objectStore
                        - serverName
                        type: object
                      replicas:
                        default: 1
                        description: |-
                          replicas is the number of PostgreSQL instances in the cluster: a
                          primary plus streaming-replication hot standbys with automated
                          failover. 1 (the default) is a single instance; raising it after
                          install grows the topology live.
                        format: int32
                        minimum: 1
                        type: integer
                      storageClassName:
