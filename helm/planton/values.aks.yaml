# Planton on Azure AKS.
#
#   helm install planton oci://ghcr.io/plantonhq/charts/planton \
#     --namespace planton --create-namespace \
#     --set platform.spec.version=<release> \
#     --values https://raw.githubusercontent.com/plantonhq/planton/main/helm/planton/values.aks.yaml
#
# Stock AKS ships no always-on ingress controller (the "application routing
# add-on" is optional), and every remaining choice is specific to YOUR
# subscription -- so this file is a recipe: nothing here is active (the base
# install already works on AKS with zero values), and each block below is one
# uncommented edit away.

platform:
  spec: {}
    # version: <release>   # REQUIRED -- the platform release to install (set it on the command line above)
    # -- Storage: AKS ships working default classes (the disk CSI driver is
    # enabled by default). To pin a specific class or override volume sizes:
    # storage:
    #   storageClassName: managed-csi-premium
    #   size: 20Gi   # optional: one size for every volume

    # -- Publish at your own URL. Enable the AKS application routing add-on
    # (class "webapprouting.kubernetes.azure.com") or install ingress-nginx,
    # then point your domain's DNS at the controller:
    # ingress:
    #   enabled: true
    #   hostname: planton.example.com
    #   ingressClassName: webapprouting.kubernetes.azure.com   # or nginx
    #   # HTTPS -- exactly one of the two, and hostname is required:
    #   tls:
    #     secretName: planton-tls                        # a cert you bring
    #     issuer: {name: letsencrypt, kind: ClusterIssuer}  # or cert-manager

    # -- Give the in-cluster runner a cloud identity with Microsoft Entra
    # Workload ID -- no keys stored anywhere. Create a managed identity with
    # a federated credential for the "runner-default" ServiceAccount in the
    # install namespace, then:
    # runner:
    #   serviceAccountAnnotations:
    #     azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000

    # -- Secrets work with zero values: the bundled secrets manager deploys
    # by default (initialized, unsealed, registered as the default secret
    # store). Opt out only if you accept losing pasted-credential storage
    # and keyless connections:
    # vault:
    #   enabled: false
