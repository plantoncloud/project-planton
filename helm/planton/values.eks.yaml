# Planton on Amazon EKS.
#
#   helm install planton oci://ghcr.io/plantonhq/charts/planton \
#     --namespace planton --create-namespace \
#     --set platform.spec.version=<release> \
#     --values https://raw.githubusercontent.com/plantonhq/planton/main/helm/planton/values.eks.yaml
#
# EKS ships no ingress controller and every remaining choice is specific to
# YOUR account (role ARNs, domains, certificates), so this file is a recipe:
# nothing here is active -- the base install already works on EKS with zero
# values -- and each block below is one uncommented edit away.

platform:
  spec: {}
    # version: <release>   # REQUIRED -- the platform release to install (set it on the command line above)
    # -- Storage: EKS clusters need the aws-ebs-csi-driver addon (with its
    # own IAM role via Pod Identity or IRSA) before any stateful workload can
    # run -- the default gp2 class exists on every cluster, but without the
    # driver every volume request hangs. The install preflight checks this.
    # To use a non-default class (e.g. a gp3 class you created):
    # storage:
    #   storageClassName: gp3
    #   size: 20Gi   # optional: one size for every volume

    # -- Publish at your own URL. Requires an ingress controller (the AWS
    # Load Balancer Controller or ingress-nginx are the common choices on
    # EKS; install one first, then point your domain's DNS at it).
    # ingress:
    #   enabled: true
    #   hostname: planton.example.com
    #   ingressClassName: alb          # or nginx; omit to use the cluster default
    #   # ALB terminates TLS with an ACM certificate via annotations instead
    #   # of the tls block:
    #   annotations:
    #     alb.ingress.kubernetes.io/scheme: internet-facing
    #     alb.ingress.kubernetes.io/target-type: ip
    #     alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/...
    #     alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'

    # -- Give the in-cluster runner a cloud identity with IRSA -- no keys
    # stored anywhere. Create an IAM role trusting this cluster's OIDC
    # provider for the "runner-default" ServiceAccount in the install
    # namespace, then:
    # runner:
    #   serviceAccountAnnotations:
    #     eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/planton-runner

    # -- Secrets work with zero values: the bundled secrets manager deploys
    # by default, initialized and registered as the default secret store.
    # To keep platform secrets in AWS Secrets Manager instead (pod identity
    # + a KMS key; the control plane's ServiceAccount needs its own IRSA
    # role) declare the backend -- the bundled vault still runs underneath,
    # serving the platform's own signing and encryption keys:
    # controlPlane:
    #   serviceAccountAnnotations:
    #     eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/planton-control-plane
    # bootstrap:
    #   secretBackend:
    #     type: awsSecretsManager
    #     awsSecretsManager:
    #       region: us-east-1
    #       kmsKeyArn: arn:aws:kms:us-east-1:123456789012:key/...
