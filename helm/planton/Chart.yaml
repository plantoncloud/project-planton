apiVersion: v2
name: planton
description: The PlantonPlatform resource as a Helm release - declare a Planton platform with proven defaults on a cluster that runs the Planton operator
type: application
# version is stamped at release time from the chart's tag (helm/planton/vX.Y.Z);
# the value below marks a checkout as a development build.
version: 0.0.0-dev
# There is deliberately no appVersion. This chart is a shape, not a pin: the
# platform release it declares is platform.spec.version in the values, named
# by the person installing (the same rule the catalog's platform kind holds).
# An appVersion here would age with every platform release and silently move
# a running platform's version the day the chart moved. The chart therefore
# releases only when the resource's shape changes. The operator that
# reconciles the resource is installed separately by the planton-operator
# chart and versions on its own line; this chart carries no operator and no
# CustomResourceDefinition.
home: https://github.com/plantonhq/planton
sources:
  - https://github.com/plantonhq/planton
maintainers:
  - name: Planton
    url: https://planton.ai
keywords:
  - planton
  - operator
  - kubernetes
  - self-hosted
  - infrastructure
kubeVersion: ">=1.24.0-0"
