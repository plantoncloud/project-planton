{% if values.install_cnpg_operator | bool %}
# CloudNativePG — the CNCF PostgreSQL operator, the engine that reconciles
# this chart's registry database into a real streaming-replication cluster
# with automated failover. A ONE-PER-CLUSTER singleton: the Helm release
# name, the cluster-scoped CRDs, and the webhook identity are all fixed
# upstream, so a second installation would fight the first — that is
# exactly what the install_cnpg_operator toggle exists for (operator-ready
# clusters set it false and their resident operator reconciles the
# database below).
#
# The operator lives in cnpg-system (the upstream convention), NOT in the
# chart's namespace: it is cluster infrastructure that outlives any one
# database, watches the whole cluster by default, and its CRDs carry
# `helm.sh/resource-policy: keep` so an uninstall never cascade-deletes
# the databases it manages.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesCloudNativePgOperator
metadata:
  name: "{{ values.env }}-cnpg-operator"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  namespace:
    value: cnpg-system
  createNamespace: true
  # The Barman Cloud backup plugin is deliberately NOT part of this chart:
  # it is its own kind (KubernetesCnpgBarmanCloudPlugin, installed into
  # this operator's namespace) and requires cert-manager on the cluster,
  # an assumption this chart does not make. The README's day-2 notes walk
  # through declaring it once cert-manager is present.
{% endif %}
